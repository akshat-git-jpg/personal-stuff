version: 2
project_name: paypal-txns-pp-cli
changelog:
  disable: true
builds:
  - id: paypal-txns-pp-cli
    main: ./cmd/paypal-txns-pp-cli
    binary: paypal-txns-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X paypal-txns-pp-cli/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: paypal-txns-pp-mcp
    main: ./cmd/paypal-txns-pp-mcp
    binary: paypal-txns-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: paypal-txns-pp-cli
    repository:
      owner: akshat-git-jpg
      name: homebrew-tap
    homepage: "https://github.com/akshat-git-jpg/paypal-txns-pp-cli"
    description: "Read-only PayPal income reporting that handles the 31-day window limit for you - pull months of transactions and a"
    install: |
      bin.install "paypal-txns-pp-cli"
      bin.install "paypal-txns-pp-mcp"
