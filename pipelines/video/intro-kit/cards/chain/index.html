<!doctype html>
<!--
  CHAIN   (intro-kit card)
  N labelled inputs converging into one named thing — drawn connector lines
  from each item down into a target chip.
  1920x1080, 30fps, VARIABLE duration (3.0-5.0s, default 3.5 — see KIT.md).

  ┌─────────────────────────────────────────────────────────────────────────┐
  │  EDITOR: edit only the  ===== CONTENT =====  block (items, target) and  │
  │  :root. Never touch the TIMELINE or DURATION blocks.                    │
  └─────────────────────────────────────────────────────────────────────────┘

  Render:  npx hyperframes@latest render cards/chain -o out.mp4 --fps 30
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --bg-from: #3a1f08; --bg-to: #0a0805;
        --text: #ffffff;
        --text-dim: rgba(255, 239, 219, 0.60);
        --accent: #fb923c;
        --font: 'Inter', system-ui, sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 1080px; overflow: hidden; background: #000; font-family: var(--font); color: var(--text); }
      #root { position: relative; width: 100%; height: 1080px; }
      #bg { position: absolute; inset: -10%; background: radial-gradient(ellipse at 30% 20%, var(--bg-from) 0%, var(--bg-to) 60%); will-change: transform; }
      #frame { position: absolute; inset: 0; }
      #lines { position: absolute; inset: 0; }
      #items { position: absolute; inset: 0; }
      .item { position: absolute; display: flex; flex-direction: column; align-items: center; opacity: 0; }
      .thumb {
        width: 380px; height: 214px; border-radius: 18px; overflow: hidden;
        border: 2px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.03);
      }
      .thumb.empty { border-color: var(--accent); }
      .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .item-label { margin-top: 18px; font-size: 30px; font-weight: 700; color: var(--accent); letter-spacing: -0.01em; opacity: 0; }
      #target {
        position: absolute; left: 50%; top: 880px; transform: translateX(-50%) scale(0.9);
        display: flex; align-items: center; gap: 16px; padding: 20px 32px; border-radius: 50px;
        background: rgba(255,255,255,0.06); border: 2px solid var(--accent); opacity: 0;
      }
      #target img { width: 44px; height: 44px; border-radius: 10px; object-fit: contain; }
      #targetLabel { font-size: 34px; font-weight: 800; letter-spacing: -0.015em; color: var(--text); }

      @keyframes hf-ambient-breathe { from { transform: scale(1); } to { transform: scale(1.012); } }
      #frame { animation: hf-ambient-breathe 6s ease-in-out alternate infinite; /* hf-ambient */ }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="chain" data-start="0" data-duration="0" data-width="1920" data-height="1080"
      data-composition-variables='{"items":[{"label":"Podcast audio","shot":"shots/mockup-chat.jpg"},{"label":"Screen capture","shot":"shots/mockup-code.jpg"},{"label":"Analytics data","shot":"shots/mockup-dashboard.jpg"}],"target":{"label":"Final video","logo":"heygen"},"duration":3.5}'>
      <div id="bg" class="clip" data-start="0" data-duration="0" data-track-index="0"></div>
      <div id="frame" class="clip" data-start="0" data-duration="0" data-track-index="1">
        <svg id="lines" viewBox="0 0 1920 1080" preserveAspectRatio="none"></svg>
        <div id="items"></div>
        <div id="target"><img id="targetLogo" alt="" /><div id="targetLabel"></div></div>
      </div>
    </div>

    <script>
      /* ===== CONTENT ===== */
      const VARS = (window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : null) || {};
      const DATA = {
        items: VARS.items ?? [
          { label: "Podcast audio", shot: "shots/mockup-chat.jpg" },
          { label: "Screen capture", shot: "shots/mockup-code.jpg" },
          { label: "Analytics data", shot: "shots/mockup-dashboard.jpg" }
        ],
        target: VARS.target ?? { label: "Final video", logo: "heygen" }
      };

      // The kit's own mirror of logos/registry.json's slug -> file map — see
      // logo-grid's identical comment for why this is not a fetch()'d lookup.
      const LOGO_FILES = {
        openart: "openart.png", higgsfield: "higgsfield.png", synthesia: "synthesia.png",
        heygen: "heygen.png", arcads: "arcads.png", n8n: "n8n.png", make: "make.png",
        zapier: "zapier.png", langchain: "langchain.png", flowise: "flowise.png",
        submagic: "submagic.png", opusclip: "opusclip.png"
      };

      /* ===== DURATION (LOCKED — identical in all 7 kit cards) ===== */
      // Kit cards are variable-length: the builder (plan 220) picks 2.0-5.0s per
      // beat from the transcript, so nothing here may hard-code a schedule.
      // The root's STATIC data-duration is deliberately "0", not the default:
      // hyperframes' render CLI only re-probes the composition length from the
      // live browser (window.__hf.duration, which reflects this script's own
      // mutation below) when the static attribute is <= 0 — any nonzero literal
      // freezes the render at that value regardless of --variables. Verified
      // empirically against the render pipeline: with the literal left at the
      // "3.5" default, `--variables '{"duration":2.0}'` still rendered a 3.5s
      // mp4; with the literal at "0" the same command renders 2.0s, and a
      // variable-less render still yields the 3.5s default below. Standalone
      // preview is unaffected — VARS.duration ?? 3.5 still governs DUR here.
      const DUR = Math.min(5, Math.max(2, Number(VARS.duration ?? 3.5)));
      const root = document.getElementById('root');
      root.setAttribute('data-duration', String(DUR));
      for (const el of root.querySelectorAll('.clip')) {
        el.setAttribute('data-duration', String(DUR));
      }
      // A fraction of the card's own length, never a wall-clock constant.
      const T = (frac) => +(DUR * frac).toFixed(3);

      /* ===== TIMELINE (LOCKED) ===== */
      const items = DATA.items.slice(0, 4);
      const N = items.length;
      const THUMB_W = 380, THUMB_H = 214, GAP = 80;
      const totalW = N * THUMB_W + (N - 1) * GAP;
      const startX = (1920 - totalW) / 2;
      const ROW_Y = 140;
      const TARGET_X = 960, TARGET_Y = 880; // chip centre

      const itemsEl = document.getElementById('items');
      const linesEl = document.getElementById('lines');
      const svgNS = 'http://www.w3.org/2000/svg';

      const itemEls = items.map((it, i) => {
        const x = startX + i * (THUMB_W + GAP);
        const wrap = document.createElement('div');
        wrap.className = 'item';
        wrap.style.left = x + 'px';
        wrap.style.top = ROW_Y + 'px';
        const thumb = document.createElement('div');
        thumb.className = it.shot ? 'thumb' : 'thumb empty';
        if (it.shot) {
          const img = document.createElement('img');
          img.src = it.shot;
          thumb.appendChild(img);
        }
        const label = document.createElement('div');
        label.className = 'item-label';
        label.textContent = it.label;
        wrap.appendChild(thumb);
        wrap.appendChild(label);
        itemsEl.appendChild(wrap);

        const path = document.createElementNS(svgNS, 'path');
        const cx = x + THUMB_W / 2;
        const startY = ROW_Y + THUMB_H + 62;
        path.setAttribute('d', `M ${cx} ${startY} Q ${(cx + TARGET_X) / 2} ${(startY + TARGET_Y) / 2} ${TARGET_X} ${TARGET_Y}`);
        path.setAttribute('stroke', 'var(--accent)');
        path.setAttribute('stroke-width', '2');
        path.setAttribute('fill', 'none');
        linesEl.appendChild(path);

        return { wrap, thumb, label, path };
      });

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.to('#bg', { scale: 1.05, x: -20, y: -10, duration: DUR, ease: 'none' }, 0);

      // Items fade + slide in staggered over T(0.0)-T(0.35).
      const enterEnd = T(0.35);
      const enterSpan = N > 1 ? enterEnd / (N - 1) : 0;
      itemEls.forEach(({ wrap, label }, i) => {
        const at = N > 1 ? i * enterSpan : 0;
        tl.fromTo(wrap, { y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: 'power2.out' }, at);
        // Each label types on right after its item lands (a one-word type-on:
        // the label is a short phrase treated as a single reveal unit).
        tl.to(label, { opacity: 1, duration: 0.1, ease: 'none' }, at + 0.3);
      });

      // Connector lines draw over T(0.4)-T(0.75).
      const drawStart = T(0.4);
      const drawEnd = T(0.75);
      const drawSpan = N > 1 ? (drawEnd - drawStart) / (N - 1) : 0;
      itemEls.forEach(({ path }, i) => {
        const len = path.getTotalLength();
        path.style.strokeDasharray = String(len);
        path.style.strokeDashoffset = String(len);
        const at = N > 1 ? drawStart + i * drawSpan : drawStart;
        tl.fromTo(path, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.4, ease: 'power1.inOut' }, at);
      });

      // Target chip scales in at T(0.72).
      const targetLogo = document.getElementById('targetLogo');
      if (DATA.target.logo && LOGO_FILES[DATA.target.logo]) {
        targetLogo.src = 'logos/' + LOGO_FILES[DATA.target.logo];
      } else {
        targetLogo.remove();
      }
      document.getElementById('targetLabel').textContent = DATA.target.label;
      tl.fromTo('#target', { scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.3, ease: 'power2.out' }, T(0.72));

      window.__timelines['chain'] = tl;
    </script>
  </body>
</html>
