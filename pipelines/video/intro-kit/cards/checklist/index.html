<!doctype html>
<!--
  CHECKLIST   (intro-kit card)
  Two to four verdict rows under one icon, on a solid accent panel. The
  reference intro shows this SAME card repeated four times back to back,
  changing only its icon and two bullet lines — it must look correct three
  times in a row, so nothing here may depend on being seen only once.
  1920x1080, 30fps, VARIABLE duration (2.5-5.0s, default 3.5 — see KIT.md).

  ┌─────────────────────────────────────────────────────────────────────────┐
  │  EDITOR: edit only the  ===== CONTENT =====  block (icon, rows) and     │
  │  :root. Never touch the TIMELINE or DURATION blocks.                    │
  └─────────────────────────────────────────────────────────────────────────┘

  Render:  npx hyperframes@latest render cards/checklist -o out.mp4 --fps 30
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --bg-from: #3a1f08; --bg-to: #0a0805;
        --text: #ffffff;
        --text-dim: rgba(255, 239, 219, 0.60);
        --accent: #fb923c;
        --ink: #0a0805; /* near-black text/marks ON the accent panel — white fails contrast here */
        --font: 'Inter', system-ui, sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 1080px; overflow: hidden; background: #000; font-family: var(--font); color: var(--text); }
      #root { position: relative; width: 100%; height: 1080px; }
      #bg { position: absolute; inset: -10%; background: radial-gradient(ellipse at 30% 20%, var(--bg-from) 0%, var(--bg-to) 60%); will-change: transform; }
      #frame { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
      #panel {
        width: 1180px; height: 620px; background: var(--accent); border-radius: 28px;
        position: relative; padding: 56px 64px; opacity: 0;
      }
      #panelIcon { width: 96px; height: 96px; margin-bottom: 28px; }
      #panelIcon svg { width: 100%; height: 100%; stroke: var(--ink); fill: none; stroke-width: 4px; stroke-linecap: round; stroke-linejoin: round; }
      #rows { display: flex; flex-direction: column; gap: 28px; }
      .row { display: flex; align-items: flex-start; gap: 22px; opacity: 0; }
      .mark {
        flex: 0 0 34px; width: 34px; height: 34px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        background: var(--ink); color: var(--accent); font-weight: 800; font-size: 20px; line-height: 1;
      }
      .mark.no { color: #ef4444; }
      .row-text { color: var(--ink); font-weight: 650; font-size: 44px; letter-spacing: -0.01em; line-height: 1.2; }

      @keyframes hf-ambient-breathe { from { transform: scale(1); } to { transform: scale(1.012); } }
      #frame { animation: hf-ambient-breathe 6s ease-in-out alternate infinite; /* hf-ambient */ }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="checklist" data-start="0" data-duration="0" data-width="1920" data-height="1080"
      data-composition-variables='{"icon":"check-circle","rows":[{"text":"One clip in, one clip out","mark":"yes"},{"text":"No manual scene-by-scene edit","mark":"yes"},{"text":"Still looks hand-cut","mark":"yes"}],"duration":3.5}'>
      <div id="bg" class="clip" data-start="0" data-duration="0" data-track-index="0"></div>
      <div id="frame" class="clip" data-start="0" data-duration="0" data-track-index="1">
        <div id="panel">
          <div id="panelIcon"><svg viewBox="0 0 96 96"><circle cx="48" cy="48" r="38"/><path d="M32 50l12 12 22-28"/></svg></div>
          <div id="rows"></div>
        </div>
      </div>
    </div>

    <script>
      /* ===== CONTENT ===== */
      const VARS = (window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : null) || {};
      const DATA = {
        icon: VARS.icon ?? "check-circle",
        rows: VARS.rows ?? [
          { text: "One clip in, one clip out", mark: "yes" },
          { text: "No manual scene-by-scene edit", mark: "yes" },
          { text: "Still looks hand-cut", mark: "yes" }
        ]
      };

      /* ===== DURATION (LOCKED — identical in all 7 kit cards) ===== */
      // Kit cards are variable-length: the builder (plan 220) picks 2.0-5.0s per
      // beat from the transcript, so nothing here may hard-code a schedule.
      // The root's STATIC data-duration is deliberately "0", not the default:
      // hyperframes' render CLI only re-probes the composition length from the
      // live browser (window.__hf.duration, which reflects this script's own
      // mutation below) when the static attribute is <= 0 — any nonzero literal
      // freezes the render at that value regardless of --variables. Verified
      // empirically against the render pipeline: with the literal left at the
      // "3.5" default, `--variables '{"duration":2.0}'` still rendered a 3.5s
      // mp4; with the literal at "0" the same command renders 2.0s, and a
      // variable-less render still yields the 3.5s default below. Standalone
      // preview is unaffected — VARS.duration ?? 3.5 still governs DUR here.
      const DUR = Math.min(5, Math.max(2, Number(VARS.duration ?? 3.5)));
      const root = document.getElementById('root');
      root.setAttribute('data-duration', String(DUR));
      for (const el of root.querySelectorAll('.clip')) {
        el.setAttribute('data-duration', String(DUR));
      }
      // A fraction of the card's own length, never a wall-clock constant.
      const T = (frac) => +(DUR * frac).toFixed(3);

      /* ===== TIMELINE (LOCKED) ===== */
      const rowsEl = document.getElementById('rows');
      const rowEls = DATA.rows.map((r) => {
        const row = document.createElement('div');
        row.className = 'row';
        const mark = document.createElement('div');
        mark.className = 'mark' + (r.mark === 'no' ? ' no' : '');
        mark.textContent = r.mark === 'no' ? '✗' : '✓';
        const text = document.createElement('div');
        text.className = 'row-text';
        text.textContent = r.text;
        row.appendChild(mark);
        row.appendChild(text);
        rowsEl.appendChild(row);
        return row;
      });

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.to('#bg', { scale: 1.05, x: -20, y: -10, duration: DUR, ease: 'none' }, 0);
      tl.fromTo('#panel', { scale: 0.94 }, { opacity: 1, scale: 1, duration: T(0.12), ease: 'power2.out' }, 0);

      const rowStart = T(0.25);
      const rowEnd = T(0.8);
      const rowSpan = rowEls.length > 1 ? (rowEnd - rowStart) / (rowEls.length - 1) : 0;
      rowEls.forEach((row, i) => {
        const at = rowEls.length > 1 ? rowStart + i * rowSpan : rowStart;
        tl.fromTo(row, { y: 14 }, { opacity: 1, y: 0, duration: 0.16, ease: 'power2.out' }, at);
      });

      window.__timelines['checklist'] = tl;
    </script>
  </body>
</html>
