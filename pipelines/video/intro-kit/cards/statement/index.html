<!doctype html>
<!--
  STATEMENT   (intro-kit card)
  The spoken line, alone, word by word — the workhorse of the kit. Expect it
  to be over half of every intro's cards. Optional single line-art icon
  drifting slowly beside the sentence.
  1920x1080, 30fps, VARIABLE duration (2.0-5.0s, default 3.5 — see KIT.md).

  ┌─────────────────────────────────────────────────────────────────────────┐
  │  EDITOR: edit only the  ===== CONTENT =====  block (text, accent,       │
  │  beats, icon) and :root. Never touch the TIMELINE or DURATION blocks.   │
  └─────────────────────────────────────────────────────────────────────────┘

  Render:  npx hyperframes@latest render cards/statement -o out.mp4 --fps 30
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --bg-from: #3a1f08; --bg-to: #0a0805;
        --text: #ffffff;
        --text-dim: rgba(255, 239, 219, 0.60);
        --accent: #fb923c;
        --font: 'Inter', system-ui, sans-serif;
        --hero-size: 64px; /* base only — the script rescales by word count:
                              <=8 words -> 120px, 9-12 -> 96px, >12 -> this
                              64px legacy fallback (same bucketing as the
                              card-library slate/kinetic-sentence exemplar). */
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 1080px; overflow: hidden; background: #000; font-family: var(--font); color: var(--text); }
      #root { position: relative; width: 100%; height: 1080px; }
      #bg { position: absolute; inset: -10%; background: radial-gradient(ellipse at 30% 20%, var(--bg-from) 0%, var(--bg-to) 60%); will-change: transform; }
      #frame { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 180px; }
      #sentence { font-size: var(--hero-size); font-weight: 800; line-height: 1.25; letter-spacing: -0.02em; color: var(--text); max-width: 1560px; text-align: center; }
      .word { display: inline-block; white-space: pre-wrap; will-change: opacity, color; }
      .word.is-accent { color: var(--accent); }
      #icon { position: absolute; left: 22%; top: 34%; width: 96px; height: 96px; opacity: 0; }
      #icon svg { width: 100%; height: 100%; stroke: var(--accent); fill: none; stroke-width: 2.5px; stroke-linecap: round; stroke-linejoin: round; }

      @keyframes hf-ambient-breathe { from { transform: scale(1); } to { transform: scale(1.012); } }
      #frame { animation: hf-ambient-breathe 6s ease-in-out alternate infinite; /* hf-ambient */ }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="statement" data-start="0" data-duration="0" data-width="1920" data-height="1080"
      data-composition-variables='{"text":"Because picking the wrong model just burns credits","accent":"burns credits","beats":[{"text":"Because","accent":false,"at":0.0},{"text":"picking","accent":false,"at":0.35},{"text":"the","accent":false,"at":0.62},{"text":"wrong","accent":false,"at":0.8},{"text":"model","accent":false,"at":1.15},{"text":"just","accent":false,"at":1.5},{"text":"burns","accent":true,"at":1.75},{"text":"credits","accent":true,"at":2.1}],"icon":null,"duration":3.5}'>
      <div id="bg" class="clip" data-start="0" data-duration="0" data-track-index="0"></div>
      <div id="frame" class="clip" data-start="0" data-duration="0" data-track-index="1">
        <div id="sentence"></div>
        <div id="icon"><svg viewBox="0 0 96 96"><circle cx="48" cy="48" r="34"/><path d="M48 24v24l16 12"/></svg></div>
      </div>
    </div>

    <script>
      /* ===== CONTENT ===== */
      const VARS = (window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : null) || {};
      const DATA = {
        text: VARS.text ?? "Because picking the wrong model just burns credits",
        accent: VARS.accent ?? "burns credits",
        beats: VARS.beats ?? [
          {"text":"Because","accent":false,"at":0.0},
          {"text":"picking","accent":false,"at":0.35},
          {"text":"the","accent":false,"at":0.62},
          {"text":"wrong","accent":false,"at":0.8},
          {"text":"model","accent":false,"at":1.15},
          {"text":"just","accent":false,"at":1.5},
          {"text":"burns","accent":true,"at":1.75},
          {"text":"credits","accent":true,"at":2.1}
        ],
        icon: VARS.icon ?? null
      };

      /* ===== DURATION (LOCKED — identical in all 7 kit cards) ===== */
      // Kit cards are variable-length: the builder (plan 220) picks 2.0-5.0s per
      // beat from the transcript, so nothing here may hard-code a schedule.
      // The root's STATIC data-duration is deliberately "0", not the default:
      // hyperframes' render CLI only re-probes the composition length from the
      // live browser (window.__hf.duration, which reflects this script's own
      // mutation below) when the static attribute is <= 0 — any nonzero literal
      // freezes the render at that value regardless of --variables. Verified
      // empirically against the render pipeline: with the literal left at the
      // "3.5" default, `--variables '{"duration":2.0}'` still rendered a 3.5s
      // mp4; with the literal at "0" the same command renders 2.0s, and a
      // variable-less render still yields the 3.5s default below. Standalone
      // preview is unaffected — VARS.duration ?? 3.5 still governs DUR here.
      const DUR = Math.min(5, Math.max(2, Number(VARS.duration ?? 3.5)));
      const root = document.getElementById('root');
      root.setAttribute('data-duration', String(DUR));
      for (const el of root.querySelectorAll('.clip')) {
        el.setAttribute('data-duration', String(DUR));
      }
      // A fraction of the card's own length, never a wall-clock constant.
      const T = (frac) => +(DUR * frac).toFixed(3);

      // Statement size buckets — see the --hero-size comment in :root.
      const wordCount = (DATA.beats || []).length;
      const bucket = wordCount <= 8 ? { size: 120, leading: 1.1 }
                   : wordCount <= 12 ? { size: 96, leading: 1.15 }
                   : { size: 64, leading: 1.25 };
      document.documentElement.style.setProperty('--hero-size', bucket.size + 'px');

      /* ===== TIMELINE (LOCKED) ===== */
      const sentenceEl = document.getElementById('sentence');
      sentenceEl.style.lineHeight = bucket.leading;

      // Accent color is applied at BUILD time as an INLINE LITERAL, resolved
      // from the live --accent token via getComputedStyle — never as a GSAP
      // color tween and never as `var(--accent)` on the span. Verified
      // against the render pipeline: in a --variables render the accent
      // words came out white with a color tween, a static class, or an
      // inline `style.color = 'var(--accent)'` — while getComputedStyle
      // resolved the token correctly and an inline literal rendered orange.
      const ACCENT = (getComputedStyle(document.documentElement).getPropertyValue('--accent') || '').trim() || '#fb923c';
      const words = DATA.beats.map((b, i) => {
        const span = document.createElement('span');
        span.className = b.accent ? 'word is-accent' : 'word';
        span.textContent = b.text + (i < DATA.beats.length - 1 ? ' ' : '');
        span.style.opacity = 0;
        if (b.accent) span.style.color = ACCENT;
        sentenceEl.appendChild(span);
        return { b, span };
      });

      // A card is only as long as the builder gave it. If the transcript's word
      // times run past the card, compress them proportionally rather than dropping
      // words — a sentence that stops mid-phrase reads as a broken render.
      const raw = words.map(({ b }) => Number(b.at) || 0);
      const last = raw.length ? raw[raw.length - 1] : 0;
      const limit = DUR * 0.9;
      const squeeze = last > limit && last > 0 ? limit / last : 1;
      const beatAt = raw.map((t) => +(t * squeeze).toFixed(3));

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.to('#bg', { scale: 1.05, x: -20, y: -10, duration: DUR, ease: 'none' }, 0);

      words.forEach(({ span }, i) => {
        tl.to(span, { opacity: 1, duration: 0.1, ease: 'none' }, beatAt[i]);
      });

      if (DATA.icon) {
        const iconEl = document.getElementById('icon');
        tl.to(iconEl, { opacity: 1, duration: 0.3, ease: 'none' }, 0);
        // Slow drift only — no spin, no bounce.
        tl.fromTo(iconEl, { rotate: -4, y: -12 }, { rotate: 4, y: 12, duration: DUR, ease: 'sine.inOut' }, 0);
      }

      window.__timelines['statement'] = tl;
    </script>
  </body>
</html>
