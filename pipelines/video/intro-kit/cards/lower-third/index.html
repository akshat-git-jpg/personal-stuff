<!doctype html>
<!--
  LOWER-THIRD   (intro-kit card)
  The ONLY overlay card in the kit — it sits over live avatar footage rather
  than replacing it. Used for the presenter's own name/role line.
  1920x1080, 30fps, VARIABLE duration (2.0-5.0s, default 3.5 — see KIT.md).
  "overlay": true in kit.json — plan 220's pacing lint counts this beat as
  AVATAR time, not graphics time, because the presenter stays on screen.

  ┌─────────────────────────────────────────────────────────────────────────┐
  │  EDITOR: edit only the  ===== CONTENT =====  block (text, accent,       │
  │  beats) and :root. Never touch the TIMELINE or DURATION blocks.         │
  └─────────────────────────────────────────────────────────────────────────┘

  Render:  npx hyperframes@latest render cards/lower-third -o out.mp4 --fps 30
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --bg-from: #3a1f08; --bg-to: #0a0805;
        --text: #ffffff;
        --text-dim: rgba(255, 239, 219, 0.60);
        --accent: #fb923c;
        --font: 'Inter', system-ui, sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      /* No #bg here — this card is an OVERLAY, the avatar sits behind it.
         html/body stay #000 only for standalone preview; the real pipeline
         renders this card with alpha. */
      html, body { width: 100%; height: 1080px; overflow: hidden; background: #000; font-family: var(--font); color: var(--text); }
      #root { position: relative; width: 100%; height: 1080px; }
      #frame { position: absolute; inset: 0; }
      #scrim {
        position: absolute; left: 0; right: 0; bottom: 0; height: 340px;
        background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.55) 100%);
        opacity: 0;
      }
      #sentence {
        position: absolute; left: 132px; bottom: 128px; right: 220px;
        font-size: 56px; font-weight: 700; letter-spacing: -0.015em; line-height: 1.15;
      }
      .word { display: inline-block; white-space: pre-wrap; will-change: opacity, color; }
      .word.is-accent { color: var(--accent); }

      @keyframes hf-ambient-breathe { from { transform: scale(1); } to { transform: scale(1.012); } }
      #frame { animation: hf-ambient-breathe 6s ease-in-out alternate infinite; /* hf-ambient */ }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="lowerthird" data-start="0" data-duration="0" data-width="1920" data-height="1080"
      data-composition-variables='{"text":"Alex Rivera, Senior Data Scientist","accent":"Data Scientist","beats":[{"text":"Alex","accent":false,"at":0.0},{"text":"Rivera,","accent":false,"at":0.28},{"text":"Senior","accent":false,"at":0.62},{"text":"Data","accent":true,"at":0.95},{"text":"Scientist","accent":true,"at":1.2}],"duration":3.5}'>
      <div id="frame" class="clip" data-start="0" data-duration="0" data-track-index="0">
        <div id="scrim"></div>
        <div id="sentence"></div>
      </div>
    </div>

    <script>
      /* ===== CONTENT ===== */
      const VARS = (window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : null) || {};
      const DATA = {
        text: VARS.text ?? "Alex Rivera, Senior Data Scientist",
        accent: VARS.accent ?? "Data Scientist",
        beats: VARS.beats ?? [
          { text: "Alex", accent: false, at: 0.0 },
          { text: "Rivera,", accent: false, at: 0.28 },
          { text: "Senior", accent: false, at: 0.62 },
          { text: "Data", accent: true, at: 0.95 },
          { text: "Scientist", accent: true, at: 1.2 }
        ]
      };

      /* ===== DURATION (LOCKED — identical in all 7 kit cards) ===== */
      // Kit cards are variable-length: the builder (plan 220) picks 2.0-5.0s per
      // beat from the transcript, so nothing here may hard-code a schedule.
      // The root's STATIC data-duration is deliberately "0", not the default:
      // hyperframes' render CLI only re-probes the composition length from the
      // live browser (window.__hf.duration, which reflects this script's own
      // mutation below) when the static attribute is <= 0 — any nonzero literal
      // freezes the render at that value regardless of --variables. Verified
      // empirically against the render pipeline: with the literal left at the
      // "3.5" default, `--variables '{"duration":2.0}'` still rendered a 3.5s
      // mp4; with the literal at "0" the same command renders 2.0s, and a
      // variable-less render still yields the 3.5s default below. Standalone
      // preview is unaffected — VARS.duration ?? 3.5 still governs DUR here.
      const DUR = Math.min(5, Math.max(2, Number(VARS.duration ?? 3.5)));
      const root = document.getElementById('root');
      root.setAttribute('data-duration', String(DUR));
      for (const el of root.querySelectorAll('.clip')) {
        el.setAttribute('data-duration', String(DUR));
      }
      // A fraction of the card's own length, never a wall-clock constant.
      const T = (frac) => +(DUR * frac).toFixed(3);

      /* ===== TIMELINE (LOCKED) ===== */
      // Accent color is applied at BUILD time as an INLINE LITERAL, resolved
      // from the live --accent token via getComputedStyle — never as a GSAP
      // color tween and never as `var(--accent)` on the span (see statement
      // card's comment for the full history of why).
      const ACCENT = (getComputedStyle(document.documentElement).getPropertyValue('--accent') || '').trim() || '#fb923c';
      const sentenceEl = document.getElementById('sentence');
      const words = DATA.beats.map((b, i) => {
        const span = document.createElement('span');
        span.className = b.accent ? 'word is-accent' : 'word';
        span.textContent = b.text + (i < DATA.beats.length - 1 ? ' ' : '');
        span.style.opacity = 0;
        if (b.accent) span.style.color = ACCENT;
        sentenceEl.appendChild(span);
        return { b, span };
      });

      // A card is only as long as the builder gave it. If the transcript's word
      // times run past the card, compress them proportionally rather than dropping
      // words — a sentence that stops mid-phrase reads as a broken render.
      const raw = words.map(({ b }) => Number(b.at) || 0);
      const last = raw.length ? raw[raw.length - 1] : 0;
      const limit = DUR * 0.9;
      const squeeze = last > limit && last > 0 ? limit / last : 1;
      const beatAt = raw.map((t) => +(t * squeeze).toFixed(3));

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Scrim fades in over T(0.08).
      tl.to('#scrim', { opacity: 1, duration: T(0.08), ease: 'power2.out' }, 0);

      // Type-on only — no drift, no slide. This card sits over live footage;
      // any extra motion here would fight the avatar behind it.
      words.forEach(({ span }, i) => {
        tl.to(span, { opacity: 1, duration: 0.1, ease: 'none' }, beatAt[i]);
      });

      window.__timelines['lowerthird'] = tl;
    </script>
  </body>
</html>
