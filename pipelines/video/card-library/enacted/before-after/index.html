<!doctype html>
<!--
  BEFORE / AFTER   (Hyperframes enacted card, single — no beats)
  Full-width compare panel: BEFORE fills the whole panel (rose-tinted, cluttered
  chips); AFTER sits stacked on top (green-tinted, clean chips), clipped by an
  accent slider that sweeps across the panel to reveal it. Light register
  (solution) sweeps left->right, building AFTER up. Dark register (problem)
  sweeps right->left, taking AFTER away back to BEFORE.
  1920x1080, 30fps, 6 seconds.

  EDITOR: change only the ===== CONTENT ===== block (title, labels, lines) and
  the :root colors. Do NOT touch ===== TIMELINE (LOCKED). Or render-time:
    --variables '{"title":"Migration","before_label":"Old","after_label":"New","before_lines":[{"line":"Slow"}],"after_lines":[{"line":"Fast"}]}'
  Render:  npx hyperframes@latest render enacted/before-after -o out.mp4 --fps 30
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --bg-from: #3a1f08; --bg-to: #0a0805;
        --text: #ffffff; --text-dim: rgba(255, 239, 219, 0.6);
        --accent: #fb923c;
        --positive: #34d399; --negative: #ef4444; --gold: #facc15;
        --font: 'Inter', system-ui, sans-serif;
        --hero-size: 130px;
      }
      body.register-light {
        --bg-from: #2b2416; --bg-to: #0a0805;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 1080px; overflow: hidden; background: #000; font-family: var(--font); color: var(--text); }
      #root { position: relative; width: 100%; height: 1080px; }
      #bg { position: absolute; inset: 0; background: radial-gradient(ellipse at 30% 20%, var(--bg-from) 0%, var(--bg-to) 60%); }
      #frame { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 120px; }
      #card { width: 100%; max-width: 1680px; display: flex; flex-direction: column; align-items: center; }
      .title { font-size: var(--hero-size); font-weight: 800; letter-spacing: -0.035em; line-height: 1.0; color: var(--text); text-align: center; margin-bottom: 24px; }

      .mk { position: relative; display: inline-block; }
      .mk-sweep { position: absolute; left: 0; bottom: 0; width: 100%; height: 45%; background: var(--accent); transform: scaleX(0); transform-origin: left; z-index: 0; }
      .mk-text { position: relative; z-index: 1; }

      .panelWrap { position: relative; width: 100%; }
      .tab { position: absolute; top: -1px; padding: 14px 36px; font-size: 24px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; border-radius: 0 0 16px 16px; z-index: 3; }
      .tab.before { left: 56px; background: rgba(239,68,68,0.18); color: var(--negative); }
      .tab.after { right: 56px; background: rgba(52,211,153,0.18); color: var(--positive); }
      body.variant-b .tab.after { top: auto; bottom: -1px; border-radius: 16px 16px 0 0; }

      .panel { position: relative; width: 100%; height: 680px; border-radius: 28px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.02); }
      /* Opaque backdrop: without it the clipped top layer's translucent chips
         let the other layer's text bleed through (double-text, found 2026-07-24). */
      .layer { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #140e08; }
      .chip-col { display: flex; flex-direction: column; gap: 22px; align-items: stretch; width: 100%; padding: 0 90px; }
      .chip { font-size: 32px; font-weight: 600; padding: 22px 36px; border-radius: 18px; line-height: 1.3; }
      .before-layer .chip { background: rgba(239,68,68,0.10); border: 1px solid rgba(239,68,68,0.30); color: var(--text); }
      .after-layer .chip { background: rgba(52,211,153,0.10); border: 1px solid rgba(52,211,153,0.32); color: var(--text); }
      .after-layer .chip:first-child { color: var(--accent); }
      .after-layer { clip-path: inset(0 100% 0 0); }

      .slider { position: absolute; top: 0; left: 0; width: 6px; height: 100%; background: var(--accent); box-shadow: 0 0 24px 6px rgba(251,146,60,0.5); z-index: 4; }
      .slider .handle { position: absolute; top: 50%; left: 50%; width: 46px; height: 46px; border-radius: 50%; background: var(--accent); transform: translate(-50%, -50%); box-shadow: 0 0 20px 6px rgba(251,146,60,0.5); }
      body.variant-b .slider { width: 100%; height: 6px; top: 0; left: 0; }

      @keyframes hf-ambient-breathe { from { transform: scale(1); } to { transform: scale(1.012); } }
      #frame { animation: hf-ambient-breathe 6s ease-in-out alternate infinite; /* hf-ambient */ }
    </style>
  </head>
  <body class="register-dark variant-a">
    <div id="root" data-composition-id="before-after" data-start="0" data-duration="6" data-width="1920" data-height="1080"
      data-composition-variables='{"title":"Migration","before_label":"Legacy","after_label":"Modern","before_lines":[{"line":"5s cold start"},{"line":"Manual deploys"},{"line":"No rollback"}],"after_lines":[{"line":"120ms cold start"},{"line":"Push-to-deploy"},{"line":"One-click rollback"}]}'>
      <div id="bg" class="clip" data-start="0" data-duration="6" data-track-index="0"></div>
      <div id="frame" class="clip" data-start="0" data-duration="6" data-track-index="1">
        <div id="card">
          <div class="title" id="title"></div>
          <div class="panelWrap">
            <div class="tab before" id="beforeTab"></div>
            <div class="tab after" id="afterTab"></div>
            <div class="panel" id="panel">
              <div class="layer before-layer" id="beforeLayer"><div class="chip-col" id="beforeList"></div></div>
              <div class="layer after-layer" id="afterLayer"><div class="chip-col" id="afterList"></div></div>
              <div class="slider" id="slider"><div class="handle"></div></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      /* ===== CONTENT ===== (editor / Gemini edits ONLY this) ===== */
      const VARS = (window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : null) || {};
      const DEFAULTS = {
        title: 'Migration',
        before_label: 'Legacy',
        after_label: 'Modern',
        before_lines: [{ line: '5s cold start' }, { line: 'Manual deploys' }, { line: 'No rollback' }],
        after_lines: [{ line: '120ms cold start' }, { line: 'Push-to-deploy' }, { line: 'One-click rollback' }],
      };
      const DATA = {
        ...DEFAULTS,
        ...VARS,
        register: VARS.register ?? 'dark',
        variant: VARS.variant ?? 'a',
        marker: VARS.marker ?? false,
      };

      if (DATA.register === 'light') document.body.classList.replace('register-dark', 'register-light');
      if (DATA.variant === 'b') document.body.classList.replace('variant-a', 'variant-b');
      const isVariantB = DATA.variant === 'b';
      const isDark = DATA.register === 'dark';

      const $ = (id) => document.getElementById(id);
      const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

      const titleEl = $('title');
      if (typeof DATA.marker === 'string' && DATA.marker.trim()) {
        const word = DATA.marker.trim();
        const title = DATA.title;
        const idx = title.toLowerCase().indexOf(word.toLowerCase());
        if (idx !== -1) {
          const before = esc(title.slice(0, idx));
          const match = esc(title.slice(idx, idx + word.length));
          const after = esc(title.slice(idx + word.length));
          titleEl.innerHTML = `${before}<span class="mk"><span class="mk-sweep"></span><span class="mk-text">${match}</span></span>${after}`;
        } else {
          titleEl.textContent = title;
        }
      } else {
        titleEl.textContent = DATA.title;
      }

      $('beforeTab').textContent = DATA.before_label;
      $('afterTab').textContent = DATA.after_label;

      const beforeList = $('beforeList');
      (DATA.before_lines || []).forEach((l) => {
        const chip = document.createElement('div');
        chip.className = 'chip';
        chip.textContent = l.line;
        beforeList.appendChild(chip);
      });
      const afterList = $('afterList');
      (DATA.after_lines || []).forEach((l) => {
        const chip = document.createElement('div');
        chip.className = 'chip';
        chip.textContent = l.line;
        afterList.appendChild(chip);
      });

      /* ===== TIMELINE (LOCKED — do not edit) ===== */
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const CHROME_IN = 0.15;

      tl.from(titleEl, { opacity: 0, y: 24, duration: 0.6, ease: 'power3.out' }, CHROME_IN);
      tl.from('.panelWrap', { opacity: 0, y: 20, duration: 0.55, ease: 'power3.out' }, CHROME_IN + 0.15);
      tl.from('.tab', { opacity: 0, y: -14, stagger: 0.08, duration: 0.4, ease: 'power2.out' }, CHROME_IN + 0.3);
      tl.from('.before-layer .chip', { opacity: 0, y: 16, stagger: 0.06, duration: 0.4, ease: 'power2.out' }, CHROME_IN + 0.4);
      tl.from('.after-layer .chip', { opacity: 0, y: 16, stagger: 0.06, duration: 0.4, ease: 'power2.out' }, CHROME_IN + 0.4);

      const sweepStart = 1.2;
      const sweepEnd = 3.2;
      const sweepDur = sweepEnd - sweepStart;
      const afterLayer = $('afterLayer');
      const slider = $('slider');
      const panelRect = $('panel').getBoundingClientRect();
      const restTime = CHROME_IN + 0.5; // moment the "at rest" state settles, before the sweep begins

      /* light (solution): AFTER starts hidden and the sweep builds it up.
         dark (problem): AFTER starts fully established and the sweep takes it away. */
      const startPct = isDark ? 100 : 0;
      const endPct = isDark ? 0 : 100;
      const clipFor = (pct) => (isVariantB ? `inset(0 0 ${100 - pct}% 0)` : `inset(0 ${100 - pct}% 0 0)`);

      tl.set(afterLayer, { clipPath: clipFor(startPct) }, restTime);
      if (!isVariantB) {
        tl.set(slider, { x: (startPct / 100) * panelRect.width }, restTime);
        tl.to(afterLayer, { clipPath: clipFor(endPct), duration: sweepDur, ease: 'power1.inOut' }, sweepStart);
        tl.to(slider, { x: (endPct / 100) * panelRect.width, duration: sweepDur, ease: 'power1.inOut' }, sweepStart);
      } else {
        tl.set(slider, { y: (startPct / 100) * panelRect.height }, restTime);
        tl.to(afterLayer, { clipPath: clipFor(endPct), duration: sweepDur, ease: 'power1.inOut' }, sweepStart);
        tl.to(slider, { y: (endPct / 100) * panelRect.height, duration: sweepDur, ease: 'power1.inOut' }, sweepStart);
      }

      if (typeof DATA.marker === 'string' && DATA.marker.trim() && titleEl.querySelector('.mk-sweep')) {
        tl.fromTo('.mk-sweep', { scaleX: 0 }, { scaleX: 1, transformOrigin: 'left', duration: 0.35, ease: 'power2.out' }, 0.9);
      }

      window.__timelines['before-after'] = tl;
    </script>
  </body>
</html>
