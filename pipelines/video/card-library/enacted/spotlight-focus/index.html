<!doctype html>
<!--
  SPOTLIGHT FOCUS   (Hyperframes enacted card, single kind)
  A dimmed grid of item tiles. A soft spotlight sweeps across them in reading
  order, then locks on the focus tile — which brightens, gains the accent
  keyline, and gets a "chosen" tick, while every other tile drops away.
  1920x1080, 30fps, 6 seconds. Enacts: picking one option out of many.

  EDITOR: change only the ===== CONTENT ===== defaults (title, items[], focus)
  and the :root colors. Do NOT touch ===== TIMELINE (LOCKED). Or render-time:
    --variables '{"title":"Selection","items":[{"item":"A"},{"item":"B"}],"focus":"B"}'
  Render:  npx hyperframes@latest render enacted/spotlight-focus -o out.mp4 --fps 30
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --bg-from: #3a1f08; --bg-to: #0a0805;
        --text: #ffffff; --text-dim: rgba(255, 239, 219, 0.6);
        --accent: #fb923c;
        --positive: #34d399; --negative: #fb7185; --gold: #facc15;
        --font: 'Inter', system-ui, sans-serif;
        --hero-size: 150px;
      }
      body.register-light {
        --bg-from: #2b2416; --bg-to: #0a0805;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 1080px; overflow: hidden; background: #000; font-family: var(--font); color: var(--text); }
      #root { position: relative; width: 100%; height: 1080px; }
      #bg { position: absolute; inset: 0; background: radial-gradient(ellipse at 30% 20%, var(--bg-from) 0%, var(--bg-to) 60%); }
      #frame { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 110px 130px; }
      #card { width: 100%; max-width: 1660px; height: 100%; display: flex; flex-direction: column; position: relative; }

      .title { font-size: var(--hero-size); font-weight: 800; letter-spacing: -0.035em; line-height: 1.0; color: var(--text); text-align: center; margin-bottom: 40px; flex: 0 0 auto; }

      #gridWrap { position: relative; flex: 1 1 auto; display: flex; align-items: center; justify-content: center; }
      body.variant-b #gridWrap { flex-direction: row-reverse; } /* layout is symmetric; kept for contract parity */
      #grid { position: relative; width: 100%; height: 100%; display: grid; grid-template-rows: repeat(2, 1fr); gap: 32px; z-index: 2; }

      .tile {
        position: relative;
        background: rgba(255, 255, 255, 0.045);
        border: 2px solid rgba(255, 255, 255, 0.1);
        border-radius: 24px;
        display: flex; align-items: center; justify-content: center;
        text-align: center; padding: 24px;
        font-size: 32px; font-weight: 600; line-height: 1.25;
      }
      .tile .tick {
        position: absolute; top: -16px; right: -16px; width: 52px; height: 52px;
        border-radius: 50%; background: rgba(255,255,255,0.95); color: var(--accent);
        display: flex; align-items: center; justify-content: center;
        font-size: 26px; font-weight: 900; opacity: 0; transform: scale(0);
      }

      #spotlight {
        position: absolute; width: 560px; height: 560px; border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 246, 230, 0.28) 0%, rgba(255, 246, 230, 0) 68%);
        pointer-events: none; z-index: 1; opacity: 0;
      }

      .mk { position: relative; display: inline-block; }
      .mk-sweep { position: absolute; left: -6px; right: -6px; bottom: 0; height: 45%; background: var(--accent); transform: scaleX(0); transform-origin: left; z-index: 0; }
      .mk-text { position: relative; z-index: 1; }

      @keyframes hf-ambient-breathe { from { transform: scale(1); } to { transform: scale(1.012); } }
      #frame { animation: hf-ambient-breathe 6s ease-in-out alternate infinite; /* hf-ambient */ }
    </style>
  </head>
  <body class="register-dark variant-a">
    <div id="root" data-composition-id="spotlight-focus" data-start="0" data-duration="6" data-width="1920" data-height="1080"
      data-composition-variables='{"title":"Selection","items":[{"item":"Option A"},{"item":"Option B"},{"item":"Option C"},{"item":"Option D"},{"item":"Option E"},{"item":"Option F"}],"focus":"Option D"}'>
      <div id="bg" class="clip" data-start="0" data-duration="6" data-track-index="0"></div>
      <div id="frame" class="clip" data-start="0" data-duration="6" data-track-index="1">
        <div id="card">
          <div class="title" id="title"></div>
          <div id="gridWrap">
            <div id="spotlight"></div>
            <div id="grid"></div>
          </div>
        </div>
      </div>
    </div>

    <script>
      /* ===== CONTENT ===== (editor / Gemini edits ONLY this) ===== */
      const VARS = (window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : null) || {};
      const DATA = {
        ...JSON.parse('{"title":"Selection","items":[{"item":"Option A"},{"item":"Option B"},{"item":"Option C"},{"item":"Option D"},{"item":"Option E"},{"item":"Option F"}],"focus":"Option D"}'),
        ...VARS,
        register: VARS.register ?? 'dark',
        variant: VARS.variant ?? 'a',
        marker: VARS.marker ?? false,
      };

      if (DATA.register === 'light') document.body.classList.replace('register-dark', 'register-light');
      if (DATA.variant === 'b') document.body.classList.replace('variant-a', 'variant-b');

      /* ===== TIMELINE (LOCKED — do not edit) ===== */
      const $ = (id) => document.getElementById(id);

      const titleEl = $('title');
      (function renderTitle() {
        const word = typeof DATA.marker === 'string' ? DATA.marker.trim() : '';
        if (!word) { titleEl.textContent = DATA.title; return; }
        const re = new RegExp('(' + word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'i');
        if (!re.test(DATA.title)) { titleEl.textContent = DATA.title; return; }
        titleEl.innerHTML = DATA.title.replace(re, '<span class="mk"><span class="mk-sweep"></span><span class="mk-text">$1</span></span>');
      })();

      const items = DATA.items;
      const n = items.length;
      const cols = Math.ceil(n / 2);
      const grid = $('grid');
      grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

      const focusIndex = Math.max(0, items.findIndex((it) => String(it.item) === String(DATA.focus)));
      const tileEls = items.map((it, i) => {
        const tile = document.createElement('div');
        tile.className = 'tile';
        const label = document.createElement('div');
        label.textContent = it.item;
        const tick = document.createElement('div');
        tick.className = 'tick';
        tick.textContent = '✓';
        tile.appendChild(label);
        tile.appendChild(tick);
        grid.appendChild(tile);
        return tile;
      });

      const spotlight = $('spotlight');

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const CHROME_IN = 0.1;
      tl.from(titleEl, { opacity: 0, y: 20, duration: 0.5, ease: 'power3.out' }, CHROME_IN);
      if (typeof DATA.marker === 'string' && DATA.marker.trim() && document.querySelector('.mk-sweep')) {
        tl.fromTo('.mk-sweep', { scaleX: 0 }, { scaleX: 1, transformOrigin: 'left', duration: 0.35, ease: 'power2.out' }, 0.9);
      }
      tl.from(tileEls, { opacity: 0, y: 20, duration: 0.5, stagger: 0.04, ease: 'power2.out' }, CHROME_IN + 0.15);

      // Compute tile centers relative to #gridWrap (spotlight's positioned ancestor).
      const wrapRect = $('gridWrap').getBoundingClientRect();
      const centers = tileEls.map((el) => {
        const r = el.getBoundingClientRect();
        return { x: r.left + r.width / 2 - wrapRect.left, y: r.top + r.height / 2 - wrapRect.top };
      });

      gsap.set(spotlight, { xPercent: -50, yPercent: -50 });

      const SWEEP_START = 0.8, SWEEP_END = 2.6, LOCK_AT = 2.8;
      const order = DATA.variant === 'b' ? [...tileEls.keys()].reverse() : [...tileEls.keys()];
      const perStop = (SWEEP_END - SWEEP_START) / order.length;

      tl.to(spotlight, { opacity: 1, duration: 0.3 }, SWEEP_START - 0.15);
      order.forEach((idx, k) => {
        const t = SWEEP_START + k * perStop;
        const c = centers[idx];
        tl.to(spotlight, { x: c.x, y: c.y, duration: perStop, ease: 'power1.inOut' }, t);
        tl.to(tileEls[idx], { y: -10, filter: 'brightness(1.35)', duration: perStop * 0.42, yoyo: true, repeat: 1, ease: 'sine.inOut' }, t);
      });
      tl.to(spotlight, { opacity: 0, duration: 0.35 }, LOCK_AT - 0.1);

      const focusHarder = DATA.register === 'dark';
      const dimOpacity = focusHarder ? 0.12 : 0.25;
      tileEls.forEach((el, i) => {
        if (i === focusIndex) {
          tl.to(el, { scale: 1.08, borderColor: '#fb923c', filter: 'brightness(1.15)', boxShadow: '0 0 0 2px rgba(251,146,60,0.35)', duration: 0.45, ease: 'back.out(1.6)' }, LOCK_AT);
          tl.fromTo(el.querySelector('.tick'), { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: 'back.out(2)' }, LOCK_AT + 0.15);
        } else {
          const filter = focusHarder ? 'brightness(0.7) saturate(0.25) blur(1.5px)' : 'brightness(0.85) blur(1px)';
          tl.to(el, { opacity: dimOpacity, filter, duration: 0.5, ease: 'power2.out' }, LOCK_AT);
        }
      });

      window.__timelines['spotlight-focus'] = tl;
    </script>
  </body>
</html>
