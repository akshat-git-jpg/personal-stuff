<!doctype html>
<!--
  VERDICT · SCALE   (Hyperframes enacted card)
  A balance scale: center post + base, a beam that rotates around its pivot,
  two hanging pans (each carries chips dropped onto its side). Each beat drops
  a weight chip into the named side's pan with a bounce; the beam rotates to
  reflect the running left/right tally (max +-14deg). Final tilt holds as the
  verdict. Variant b swaps which physical side each label/pan sits on.
  1920x1080, 30fps, 6 seconds.

  EDITOR: change only the ===== CONTENT ===== block (title, left_label,
  right_label, beats[]) and the :root colors. Do NOT touch
  ===== TIMELINE (LOCKED) =====.
  Render:  npx hyperframes@latest render enacted/verdict-scale -o out.mp4 --fps 30
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --bg-from: #3a1f08; --bg-to: #0a0805;
        --text: #ffffff; --text-dim: rgba(255, 239, 219, 0.6);
        --accent: #fb923c;
        --positive: #34d399; --negative: #fb7185; --gold: #facc15;
        --font: 'Inter', system-ui, sans-serif;
      }
      body.register-light {
        --bg-from: #2b2416; --bg-to: #0a0805;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; font-family: var(--font); color: var(--text); }
      #root { position: relative; width: 1920px; height: 1080px; }
      #bg { position: absolute; inset: 0; background: radial-gradient(ellipse at 30% 20%, var(--bg-from) 0%, var(--bg-to) 60%); }
      #frame { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 120px; }

      .title { position: absolute; top: 96px; left: 0; width: 100%; font-size: 64px; font-weight: 800; letter-spacing: -2px; text-align: center; }

      .mk { position: relative; display: inline-block; }
      .mk-sweep { position: absolute; left: -6px; right: -6px; bottom: 2px; height: 45%; background: var(--accent); z-index: 0; border-radius: 4px; }
      .mk-text { position: relative; z-index: 1; }

      /* ---- the scale rig ---- */
      #card { display: flex; align-items: center; justify-content: center; padding-top: 130px; }
      #rig { position: relative; width: 1400px; height: 760px; transform-origin: center top; }

      #post { position: absolute; left: 50%; top: 90px; bottom: 0; width: 22px; margin-left: -11px;
        background: linear-gradient(90deg, rgba(255,255,255,0.05), rgba(255,255,255,0.22), rgba(255,255,255,0.05));
        border-radius: 8px; }
      #base { position: absolute; left: 50%; bottom: 0; width: 340px; height: 26px; margin-left: -170px;
        background: rgba(255,255,255,0.16); border-radius: 13px; }
      #pivotCap { position: absolute; left: 50%; top: 78px; width: 44px; height: 44px; margin-left: -22px;
        background: var(--text-dim); border-radius: 50%; z-index: 5; }

      /* beam group rotates around its center (the pivot) */
      #beamGroup { position: absolute; left: 50%; top: 100px; width: 1180px; height: 24px; margin-left: -590px; }
      #beam { position: absolute; inset: 0; background: rgba(255,255,255,0.9); border-radius: 12px; }

      .side { position: absolute; top: 0; width: 280px; height: 380px; }
      .side.atLeft { left: -140px; }
      .side.atRight { right: -140px; }
      .hanger { position: absolute; left: 50%; top: 24px; width: 3px; height: 340px; margin-left: -1.5px;
        background: rgba(255,255,255,0.35); }
      .pan { position: absolute; left: 50%; bottom: 0; width: 260px; height: 96px; margin-left: -130px;
        border-radius: 20px 20px 40px 40px; border: 2px solid rgba(255,255,255,0.24);
        background: rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: center;
        gap: 10px; padding: 0 16px; flex-wrap: wrap; overflow: hidden; }

      .panLabel { position: absolute; top: -54px; left: 50%; transform: translateX(-50%);
        font-size: 26px; font-weight: 700; color: var(--text-dim); letter-spacing: 0.5px; white-space: nowrap; }

      .chip { background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.2);
        border-radius: 12px; padding: 10px 18px; font-size: 22px; font-weight: 700; color: var(--text);
        white-space: nowrap; }
      .chip.accent { background: rgba(251,146,60,0.18); border-color: var(--accent); color: var(--accent); }

      @keyframes hf-ambient-breathe { from { transform: scale(1); } to { transform: scale(1.012); } }
      #rig { animation: hf-ambient-breathe 6s ease-in-out alternate infinite; /* hf-ambient */ }
    </style>
  </head>
  <body class="register-dark variant-a">
    <div id="root" data-composition-id="verdict-scale" data-start="0" data-duration="6" data-width="1920" data-height="1080"
      data-composition-variables='{"title":"The Verdict","left_label":"Pros","right_label":"Cons","beats":[{"side":"left","label":"Fast setup","at":0.8},{"side":"left","label":"Cheap","at":1.6},{"side":"right","label":"No EU region","at":2.4},{"side":"left","label":"Great support","at":3.2}]}'>
      <div id="bg" class="clip" data-start="0" data-duration="6" data-track-index="0"></div>
      <div id="frame" class="clip" data-start="0" data-duration="6" data-track-index="1">
        <div id="card" style="width:100%; height:100%; position:relative;">
          <div class="title" id="title"></div>
          <div id="rig">
            <div id="base"></div>
            <div id="post"></div>
            <div id="pivotCap"></div>
            <div id="beamGroup">
              <div id="beam"></div>
              <div class="side" id="sideA">
                <div class="panLabel" id="labelA"></div>
                <div class="hanger" style="left:22%;"></div>
                <div class="hanger" style="left:78%;"></div>
                <div class="pan" id="panA"></div>
              </div>
              <div class="side" id="sideB">
                <div class="panLabel" id="labelB"></div>
                <div class="hanger" style="left:22%;"></div>
                <div class="hanger" style="left:78%;"></div>
                <div class="pan" id="panB"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      /* ===== CONTENT ===== (editor / Gemini edits ONLY this) ===== */
      const VARS = (window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : null) || {};
      const DEFAULTS = {
        title: 'The Verdict',
        left_label: 'Pros',
        right_label: 'Cons',
        beats: [
          { side: 'left',  label: 'Fast setup',    at: 0.8 },
          { side: 'left',  label: 'Cheap',          at: 1.6 },
          { side: 'right', label: 'No EU region',   at: 2.4 },
          { side: 'left',  label: 'Great support',  at: 3.2 },
        ],
      };
      const DATA = {
        ...DEFAULTS,
        ...VARS,
        register: VARS.register ?? 'dark',
        variant: VARS.variant ?? 'a',
        marker: VARS.marker ?? false,
      };

      if (DATA.register === 'light') document.body.classList.replace('register-dark', 'register-light');
      if (DATA.variant === 'b') document.body.classList.replace('variant-a', 'variant-b');

      /* ===== TIMELINE (LOCKED — do not edit) ===== */
      const $ = (id) => document.getElementById(id);

      // title + marker word wrap
      (function renderTitle() {
        const titleEl = $('title');
        const word = (typeof DATA.marker === 'string' && DATA.marker.trim()) ? DATA.marker.trim() : null;
        if (word) {
          const re = new RegExp('(' + word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'i');
          const parts = DATA.title.split(re);
          titleEl.innerHTML = parts.map((part) => {
            if (part.toLowerCase() === word.toLowerCase()) {
              return `<span class="mk"><span class="mk-sweep"></span><span class="mk-text">${part}</span></span>`;
            }
            return part;
          }).join('');
        } else {
          titleEl.textContent = DATA.title;
        }
      })();

      // variant a: DOM slot A sits physically left (sideA -> atLeft), slot B sits right.
      // variant b: swap which physical side each slot occupies — a literal labels/pans swap.
      const isB = DATA.variant === 'b';
      $('sideA').classList.add(isB ? 'atRight' : 'atLeft');
      $('sideB').classList.add(isB ? 'atLeft' : 'atRight');
      $('labelA').textContent = DATA.left_label;
      $('labelB').textContent = DATA.right_label;

      // map a beat's semantic side ("left"/"right") to its DOM slot (A carries left_label, B carries right_label)
      const panFor = (side) => (side === 'left' ? $('panA') : $('panB'));

      const MAX_TILT = 14; // degrees
      const beats = (DATA.beats || []).slice(0, 6);
      let leftCount = 0, rightCount = 0;
      let lastAccentChip = null;

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.from('#title', { opacity: 0, y: 24, duration: 0.6, ease: 'power3.out' }, 0.1);
      tl.from('#rig', { opacity: 0, y: 30, duration: 0.6, ease: 'power3.out' }, 0.2);
      tl.from(['#labelA', '#labelB'], { opacity: 0, duration: 0.4, ease: 'power2.out' }, 0.35);

      beats.forEach((b) => {
        if (b.side === 'left') leftCount += 1; else rightCount += 1;
        const total = leftCount + rightCount;
        // net > 0 => left heavier => beam rotates so the left end drops (negative CSS rotation)
        const net = leftCount - rightCount;
        const rot = gsap.utils.clamp(-MAX_TILT, MAX_TILT, -(net / total) * MAX_TILT);

        const chip = document.createElement('div');
        chip.className = 'chip';
        chip.textContent = b.label;
        gsap.set(chip, { opacity: 0, y: -40, scale: 0.7 });
        panFor(b.side).appendChild(chip);

        tl.to(chip, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: 'back.out(2.2)' }, b.at);
        // beam tips to the running tally...
        tl.to('#beamGroup', { rotation: rot, duration: 0.6, ease: 'power2.out', transformOrigin: 'center center' }, b.at);
        // ...while each side's pan counter-rotates so it stays level as it travels with the beam end
        tl.to('#sideA, #sideB', { rotation: -rot, duration: 0.6, ease: 'power2.out', transformOrigin: '50% 0%' }, b.at);

        // keep exactly ONE accent element: the most recently dropped chip
        if (lastAccentChip) tl.set(lastAccentChip, { className: '-=accent' }, b.at);
        tl.set(chip, { className: '+=accent' }, b.at);
        lastAccentChip = chip;
      });

      if (typeof DATA.marker === 'string' && DATA.marker.trim()) {
        tl.fromTo('.mk-sweep', { scaleX: 0 }, { scaleX: 1, transformOrigin: 'left', duration: 0.35, ease: 'power2.out' }, 0.9);
      }

      window.__timelines['verdict-scale'] = tl;
    </script>
  </body>
</html>
