<!doctype html>
<!--
  BAD CLIP MONTAGE (Hyperframes enacted card, beat)
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --bg-from: #3a1f08; --bg-to: #0a0805;
        --text: #ffffff;
        --accent: #fb923c;
        --negative: #ef4444;
        --font: 'Inter', system-ui, sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 1080px; overflow: hidden; background: #000; font-family: var(--font); color: var(--text); }
      #root { position: relative; width: 100%; height: 1080px; }
      #bg { position: absolute; inset: 0; background: radial-gradient(ellipse at 30% 20%, var(--bg-from) 0%, var(--bg-to) 60%); }
      #frame { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 120px; }
      
      #card { width: 100%; max-width: 1680px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      .title { font-size: 64px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; color: var(--text); text-align: center; margin-bottom: 64px; }
      .title .mk-text { color: var(--accent); }

      .layout { display: flex; align-items: center; justify-content: center; gap: 100px; width: 100%; }

      .device {
        position: relative;
        width: 432px; height: 768px;
        border-radius: 28px;
        border: 1px solid rgba(255,255,255,0.10);
        background: rgba(255,255,255,0.03);
        overflow: hidden;
        flex-shrink: 0;
      }
      .speaker {
        position: absolute; top: 120px; left: 66px; width: 300px; height: 400px;
        background: #555555; border-radius: 16px;
      }
      .safe-area {
        position: absolute; top: 120px; left: 66px; width: 300px; height: 400px;
        border: 3px dashed rgba(255,255,255,0.3); border-radius: 16px;
        opacity: 0;
      }
      .caption-bar {
        position: absolute; bottom: 80px; left: 40px; right: 40px; height: 80px;
        background: rgba(0,0,0,0.6); border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
        display: flex; align-items: center; justify-content: center;
        overflow: hidden;
      }
      .caption-text {
        /* Centered by the bar's flex; ellipsis instead of a mid-glyph chop —
           the old absolute+x-offset marquee clipped the string's head and read
           as a bug on the storyboard (owner, 2026-07-31). */
        font-size: 28px; font-weight: 600; color: white; white-space: nowrap;
        max-width: 92%; overflow: hidden; text-overflow: ellipsis;
      }
      .progress-marker {
        position: absolute; bottom: 0; left: 60%; width: 4px; height: 100%; background: var(--accent);
        opacity: 0; z-index: 2;
      }
      .cut-line {
        position: absolute; top: 0; bottom: 0; left: 35%; width: 4px; background: var(--negative);
        opacity: 0; z-index: 10;
      }

      .labels {
        display: flex; flex-direction: column; gap: 32px;
      }
      .label-row {
        display: flex; align-items: center; gap: 20px;
        font-size: 40px; font-weight: 600; color: rgba(255,255,255,0.28);
      }
      .label-chip {
        display: flex; align-items: center; justify-content: center;
        width: 40px; height: 40px; border-radius: 50%; background: var(--negative);
        color: #000; font-size: 24px; font-weight: 800; opacity: 0;
      }

      @keyframes hf-ambient-breathe { from { transform: scale(1); } to { transform: scale(1.012); } }
      #frame { animation: hf-ambient-breathe 6s ease-in-out alternate infinite; /* hf-ambient */ }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="bad-clip-montage" data-start="0" data-duration="9" data-width="1920" data-height="1080"
      data-composition-variables='{"title":"Automated, Then Fixed By Hand","clips":[{"label":"Captions land late"},{"label":"Speaker out of frame"},{"label":"Cut lands mid-word"}]}'>
      <div id="bg" class="clip" data-start="0" data-duration="9" data-track-index="0"></div>
      <div id="frame" class="clip" data-start="0" data-duration="9" data-track-index="1">
        <div id="card">
          <div class="title" id="title"></div>
          <div class="layout">
            <div class="device">
              <div class="safe-area" id="safeArea"></div>
              <div class="speaker" id="speaker"></div>
              <div class="cut-line" id="cutLine"></div>
              <div class="caption-bar">
                <div class="progress-marker" id="progressMarker"></div>
                <div class="caption-text" id="captionText"></div>
              </div>
            </div>
            <div class="labels" id="labelsList"></div>
          </div>
        </div>
      </div>
    </div>

    <script>
      /* ===== CONTENT ===== (editor / Gemini edits ONLY this) ===== */
      const VARS = (window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : null) || {};
      const DEFAULTS = {
        title: 'Automated, Then Fixed By Hand',
        clips: [
          { label: 'Captions land late' },
          { label: 'Speaker out of frame' },
          { label: 'Cut lands mid-word' }
        ],
        marker: 'Fixed'
      };
      const DATA = { ...DEFAULTS, ...VARS, marker: VARS.marker ?? 'Fixed' };

      const $ = (id) => document.getElementById(id);
      const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

      const titleEl = $('title');
      if (typeof DATA.marker === 'string' && DATA.marker.trim()) {
        const word = DATA.marker.trim();
        const title = DATA.title;
        const idx = title.toLowerCase().indexOf(word.toLowerCase());
        if (idx !== -1) {
          const before = esc(title.slice(0, idx));
          const match = esc(title.slice(idx, idx + word.length));
          const after = esc(title.slice(idx + word.length));
          titleEl.innerHTML = `${before}<span class="mk-text">${match}</span>${after}`;
        } else {
          titleEl.textContent = title;
        }
      } else {
        titleEl.textContent = DATA.title;
      }

      const labelsList = $('labelsList');
      (DATA.clips || []).forEach((c, i) => {
        const row = document.createElement('div');
        row.className = `label-row label-${i+1}`;
        const chip = document.createElement('div');
        chip.className = 'label-chip';
        chip.textContent = '!';
        const txt = document.createElement('div');
        txt.textContent = c.label;
        row.appendChild(chip);
        row.appendChild(txt);
        labelsList.appendChild(row);
      });

      /* ===== TIMELINE (LOCKED — do not edit) ===== */
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const CHROME_IN = 0.15;

      tl.from(titleEl, { opacity: 0, y: 24, duration: 0.6, ease: 'power3.out' }, CHROME_IN);
      tl.from('.device', { opacity: 0, y: 20, duration: 0.55, ease: 'power3.out' }, CHROME_IN + 0.15);
      tl.from('.label-row', { opacity: 0, x: 20, stagger: 0.1, duration: 0.4, ease: 'power2.out' }, CHROME_IN + 0.3);

      // Beats: the resolver injects variables.beats as [{label, at}]; without
      // them keep the demo cadence. Caption strings DERIVE from the clip labels
      // — the old hardcoded strings kept showing default copy after a cue
      // overrode the labels (owner, 2026-07-31).
      const clipList = DATA.clips || [];
      const injectedBeats = Array.isArray(DATA.beats) && DATA.beats.length ? DATA.beats : null;
      const beatAt = (i, demo) => {
        if (injectedBeats) {
          const m = injectedBeats.find((b) => b.label === clipList[i]?.label);
          if (m && typeof m.at === 'number') return Math.max(0.9, m.at);
        }
        return demo;
      };
      const cap = (i) => (clipList[i]?.label ?? '').toLowerCase();
      const BEAT1 = beatAt(0, 0);
      const BEAT2 = beatAt(1, 3);
      const BEAT3 = beatAt(2, 6);

      // Reset states
      tl.set('.label-row', { color: 'rgba(255,255,255,0.28)' }, 0);
      tl.set('.label-chip', { opacity: 0 }, 0);

      // BEAT 1: Captions land late
      tl.set('.label-1', { color: 'var(--negative)' }, BEAT1);
      tl.set('.label-1 .label-chip', { opacity: 1 }, BEAT1);
      tl.set('#progressMarker', { opacity: 1 }, BEAT1);
      tl.set('#captionText', { textContent: cap(0) }, BEAT1);
      tl.set('#speaker', { x: 0 }, BEAT1);
      tl.set('#safeArea', { opacity: 0 }, BEAT1);
      tl.set('#cutLine', { opacity: 0 }, BEAT1);

      // BEAT 2: Speaker out of frame
      tl.set('.label-1', { color: 'rgba(255,255,255,0.28)' }, BEAT2);
      tl.set('.label-1 .label-chip', { opacity: 0 }, BEAT2);
      tl.set('.label-2', { color: 'var(--negative)' }, BEAT2);
      tl.set('.label-2 .label-chip', { opacity: 1 }, BEAT2);
      
      tl.set('#progressMarker', { opacity: 0 }, BEAT2);
      tl.set('#captionText', { textContent: cap(1) }, BEAT2);
      tl.set('#speaker', { x: -160 }, BEAT2);
      tl.set('#safeArea', { opacity: 1 }, BEAT2);

      // BEAT 3: Cut lands mid-word
      tl.set('.label-2', { color: 'rgba(255,255,255,0.28)' }, BEAT3);
      tl.set('.label-2 .label-chip', { opacity: 0 }, BEAT3);
      tl.set('.label-3', { color: 'var(--negative)' }, BEAT3);
      tl.set('.label-3 .label-chip', { opacity: 1 }, BEAT3);

      tl.set('#speaker', { x: 0 }, BEAT3);
      tl.set('#safeArea', { opacity: 0 }, BEAT3);
      tl.set('#captionText', { textContent: cap(2).slice(0, Math.max(4, Math.ceil(cap(2).length * 0.45))) + '—' }, BEAT3);
      tl.set('#cutLine', { opacity: 1 }, BEAT3);

      window.__timelines['bad-clip-montage'] = tl;
    </script>
  </body>
</html>
