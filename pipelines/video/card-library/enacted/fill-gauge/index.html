<!doctype html>
<!--
  FILL-GAUGE   (Hyperframes enacted card)
  A vessel fills stepwise; each beat pours the liquid to a new level and slides in
  a label chip with a connector tick pointing at that exact level.
  1920x1080, 30fps, 6 seconds.

  EDITOR: change only the ===== CONTENT ===== defaults and :root colors.
  Do NOT touch ===== TIMELINE (LOCKED). Or render-time:
    --variables '{"title":"System Load","unit":"%","beats":[{"label":"App","value":"40","at":0.5}]}'
  Render:  npx hyperframes@latest render enacted/fill-gauge -o out.mp4 --fps 30
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --bg-from: #3a1f08; --bg-to: #0a0805;
        --text: #ffffff; --text-dim: rgba(255, 239, 219, 0.6);
        --accent: #fb923c;
        --positive: #34d399; --negative: #fb7185; --gold: #facc15;
        --font: 'Inter', system-ui, sans-serif;
      }
      body.register-light {
        --bg-from: #2b2416; --bg-to: #0a0805;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 1080px; overflow: hidden; background: #000; font-family: var(--font); color: var(--text); }
      #root { position: relative; width: 100%; height: 1080px; }
      #bg { position: absolute; inset: 0; background: radial-gradient(ellipse at 30% 20%, var(--bg-from) 0%, var(--bg-to) 60%); }
      #frame { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 120px; }
      #card { width: 100%; max-width: 1560px; display: flex; flex-direction: column; align-items: center; }

      .title { font-size: 72px; font-weight: 800; letter-spacing: -2px; text-align: center; margin-bottom: 64px; }

      .stage { position: relative; display: flex; align-items: flex-start; justify-content: center; gap: 2.917vw; }
      body.variant-b .stage { flex-direction: row-reverse; }

      .vessel {
        position: relative; width: 26.04vw; height: 33.33vw; flex: 0 0 auto;
        border-radius: 48px; overflow: hidden;
        background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.14);
        box-shadow: inset 0 0 60px rgba(0,0,0,0.35);
      }
      .liquid {
        position: absolute; left: 6px; right: 6px; bottom: 6px; height: 0%;
        border-radius: 0 0 42px 42px;
        background: linear-gradient(180deg, #fdba74 0%, var(--accent) 40%, #c2540f 100%);
      }
      /* dark register (default): vessel DRAINS from a full start level downward */
      body.register-dark .liquid { bottom: auto; top: 6px; border-radius: 42px 42px 0 0; }

      .meniscus {
        position: absolute; left: 0; right: 0; top: 0; height: 8px;
        background: rgba(255,255,255,0.65); box-shadow: 0 0 16px rgba(255,255,255,0.45);
      }
      body.register-dark .meniscus { top: auto; bottom: 0; }
      .liquid .shine {
        position: absolute; left: 14%; top: 0; bottom: 0; width: 16%;
        background: linear-gradient(180deg, rgba(255,255,255,0.28), rgba(255,255,255,0));
        border-radius: 40px;
      }

      .labels { position: relative; width: 29.17vw; height: 33.33vw; flex: 0 0 auto; }
      .chip {
        position: absolute; left: 0; right: 0; transform: translateY(-50%);
        display: flex; align-items: center; gap: 20px; opacity: 0;
      }
      body.variant-b .chip { flex-direction: row-reverse; }
      .chip .tick { position: relative; width: 96px; height: 2px; flex: 0 0 auto; background: rgba(255,255,255,0.28); }
      .chip .tick::after {
        content: ''; position: absolute; top: -4px; right: -5px; width: 10px; height: 10px;
        border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px rgba(251,146,60,0.7);
      }
      body.variant-b .chip .tick::after { right: auto; left: -5px; }
      .chip .body {
        background: rgba(255,255,255,0.045); border: 1px solid rgba(255,255,255,0.1);
        border-radius: 18px; padding: 18px 28px; min-width: 260px;
      }
      .chip .label {
        font-size: 21px; font-weight: 700; color: var(--text-dim);
        text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 6px;
      }
      .chip .value { font-size: 42px; font-weight: 800; letter-spacing: -1px; }
      .chip .value .unit { font-size: 24px; font-weight: 600; color: var(--text-dim); margin-left: 6px; }

      .mk { position: relative; display: inline-block; }
      .mk-sweep { position: absolute; left: -8px; right: -8px; bottom: 0; height: 45%; background: var(--accent); transform: scaleX(0); z-index: 0; }
      .mk-text { position: relative; z-index: 1; }

      @keyframes hf-ambient-breathe { from { transform: scale(1); } to { transform: scale(1.012); } }
      #frame { animation: hf-ambient-breathe 6s ease-in-out alternate infinite; /* hf-ambient */ }
    </style>
  </head>
  <body class="register-dark variant-a">
    <div id="root" data-composition-id="fill-gauge" data-start="0" data-duration="6" data-width="1920" data-height="1080"
      data-composition-variables='{"title":"System Load","unit":"%","beats":[{"label":"App","value":"40","at":0.5},{"label":"DB","value":"20","at":1.5}]}'>
      <div id="bg" class="clip" data-start="0" data-duration="6" data-track-index="0"></div>
      <div id="frame" class="clip" data-start="0" data-duration="6" data-track-index="1">
        <div id="card">
          <div class="title" id="title"></div>
          <div class="stage">
            <div class="vessel">
              <div class="liquid" id="liquid">
                <div class="meniscus"></div>
                <div class="shine"></div>
              </div>
            </div>
            <div class="labels" id="labels"></div>
          </div>
        </div>
      </div>
    </div>

    <script>
      /* ===== CONTENT ===== (editor / Gemini edits ONLY this) ===== */
      const DEFAULTS = { title: 'System Load', unit: '%', beats: [
        { label: 'App', value: '40', at: 0.5 },
        { label: 'DB',  value: '20', at: 1.5 },
      ] };
      const VARS = (window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : null) || {};
      const DATA = {
        title: VARS.title ?? DEFAULTS.title,
        unit: VARS.unit ?? DEFAULTS.unit,
        beats: VARS.beats ?? DEFAULTS.beats,
        register: VARS.register ?? 'dark',
        variant: VARS.variant ?? 'a',
        marker: VARS.marker ?? false,
      };

      if (DATA.register === 'light') document.body.classList.replace('register-dark', 'register-light');
      if (DATA.variant === 'b') document.body.classList.replace('variant-a', 'variant-b');
      const isDark = !document.body.classList.contains('register-light');

      /* ===== TIMELINE (LOCKED — do not edit) ===== */
      const $ = (id) => document.getElementById(id);
      const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));
      // read the rendered height rather than hardcoding 640 — .vessel is sized
      // in vw so it scales with the canvas (side mode renders at 1200 wide).
      const VESSEL_H = document.querySelector('.vessel').getBoundingClientRect().height;
      // fixed, NOT scaled with VESSEL_H — the chip's own height (font-size,
      // padding) never shrinks, so the minimum gap between stacked chips stays
      // the same physical size regardless of canvas width.
      const CHIP_GAP = 96;

      const title = $('title');
      title.textContent = DATA.title;

      // marker: wrap the matched word from the title in a sweep-highlight span
      if (typeof DATA.marker === 'string' && DATA.marker.trim()) {
        const word = DATA.marker.trim();
        const escaped = word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const re = new RegExp('(' + escaped + ')', 'i');
        if (re.test(title.textContent)) {
          title.innerHTML = title.textContent.replace(
            re,
            '<span class="mk"><span class="mk-sweep"></span><span class="mk-text">$1</span></span>'
          );
        }
      }

      // surface-from-top (px) for a given value%, depends on fill anchor direction
      const surfaceY = (val) => isDark ? VESSEL_H * (val / 100) : VESSEL_H * (1 - val / 100);

      const withY = DATA.beats.map((b) => ({ b, val: clamp(parseFloat(b.value) || 0, 0, 100), raw: surfaceY(clamp(parseFloat(b.value) || 0, 0, 100)) }));

      // build the chip DOM first so we can measure its REAL rendered height —
      // the chip's font sizes never shrink, so its height is fixed regardless
      // of canvas width, but a constant tuned for the 1920 vessel would be
      // wrong once VESSEL_H shrinks in side mode. Position (top) is set below,
      // once the minimum gap is known.
      const chips = DATA.beats.map((b) => {
        const item = withY.find((w) => w.b === b);
        const chip = document.createElement('div');
        chip.className = 'chip';
        chip.innerHTML =
          '<div class="tick"></div>' +
          '<div class="body">' +
            '<div class="label"></div>' +
            '<div class="value"><span class="num"></span><span class="unit"></span></div>' +
          '</div>';
        chip.querySelector('.label').textContent = b.label ?? '';
        chip.querySelector('.num').textContent = String(Math.round(item.val));
        chip.querySelector('.unit').textContent = DATA.unit ?? '';
        $('labels').appendChild(chip);
        return { b, item, chip };
      });
      const measuredGap = chips.length ? chips[0].chip.getBoundingClientRect().height + 12 : CHIP_GAP;
      const gap = Math.max(CHIP_GAP, measuredGap);

      const order = [...withY].sort((a, c) => a.raw - c.raw);
      let prevY = -Infinity;
      order.forEach((item) => {
        let y = item.raw;
        if (y - prevY < gap) y = prevY + gap;
        item.y = y;
        prevY = y;
      });
      // clamp the stack back inside the column bounds
      const overflow = prevY - (VESSEL_H - 20);
      if (overflow > 0) order.forEach((item) => { item.y -= overflow; });
      order.forEach((item) => { item.y = clamp(item.y, 20, VESSEL_H - 20); });

      chips.forEach(({ item, chip }) => { chip.style.top = item.y + 'px'; });

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const CHROME_IN = 0.15;
      tl.from('.title', { opacity: 0, y: -24, duration: 0.6, ease: 'power3.out' }, CHROME_IN);
      tl.from('.vessel', { opacity: 0, scale: 0.94, duration: 0.6, ease: 'power3.out' }, CHROME_IN + 0.05);

      DATA.beats.forEach((b) => {
        const val = clamp(parseFloat(b.value) || 0, 0, 100);
        tl.to('#liquid', { height: val + '%', duration: 0.7, ease: 'power2.out' }, b.at);
      });

      chips.forEach(({ b, chip }) => {
        const dir = document.body.classList.contains('variant-b') ? -1 : 1;
        tl.fromTo(chip, { opacity: 0, x: 40 * dir }, { opacity: 1, x: 0, duration: 0.5, ease: 'power2.out' }, b.at + 0.05);
      });

      if (title.querySelector('.mk-sweep')) {
        tl.fromTo('.mk-sweep', { scaleX: 0 }, { scaleX: 1, transformOrigin: 'left', duration: 0.35, ease: 'power2.out' }, 0.9);
      }

      window.__timelines['fill-gauge'] = tl;
    </script>
  </body>
</html>
