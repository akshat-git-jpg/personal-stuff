<!doctype html>
<!--
  RACE-BARS   (Hyperframes enacted card)
  Horizontal lanes race to each beat's values; the leading bar recomputes and
  glows accent each beat; a bar that fails to advance judders and dims (stalled).
  1920x1080, 30fps, 6 seconds.

  EDITOR: change only the ===== CONTENT ===== defaults and :root colors.
  Do NOT touch ===== TIMELINE (LOCKED). Or render-time:
    --variables '{"title":"Benchmark","products":[{"name":"OpusClip"},{"name":"Submagic"}],"productLogos":["opusclip","submagic"],"beats":[{"values":[{"value":"40"},{"value":"55"}],"at":0.6}]}'
  Render:  npx hyperframes@latest render enacted/race-bars -o out.mp4 --fps 30
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --bg-from: #3a1f08; --bg-to: #0a0805;
        --text: #ffffff; --text-dim: rgba(255, 239, 219, 0.6);
        --accent: #fb923c;
        --positive: #34d399; --negative: #fb7185; --gold: #facc15;
        --font: 'Inter', system-ui, sans-serif;
        --hero-size: 150px;
      }
      body.register-light {
        --bg-from: #2b2416; --bg-to: #0a0805;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 1080px; overflow: hidden; background: #000; font-family: var(--font); color: var(--text); }
      #root { position: relative; width: 100%; height: 1080px; }
      #bg { position: absolute; inset: 0; background: radial-gradient(ellipse at 30% 20%, var(--bg-from) 0%, var(--bg-to) 60%); }
      #frame { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 120px; }
      #card { width: 100%; max-width: 1560px; display: flex; flex-direction: column; align-items: center; }

      .title { font-size: var(--hero-size); font-weight: 800; letter-spacing: -0.035em; line-height: 1.0; color: var(--text); text-align: center; margin-bottom: 60px; }

      .lanes { position: relative; width: 100%; display: flex; flex-direction: column; gap: 26px; }
      body.variant-b .lanes { flex-direction: column-reverse; }

      .finish {
        position: absolute; top: -10px; bottom: -10px; right: 0; width: 5px;
        background: repeating-linear-gradient(180deg, rgba(255,255,255,0.85) 0 12px, transparent 12px 24px);
      }

      .lane { display: flex; align-items: center; gap: 32px; }
      /* Owner rule 2026-07-30: a graphic must carry a colour mark, not text alone.
         productLogos[] is index-aligned with products[] and is a shape
         lib/logos-inline.mjs already inlines, so slugs resolve with no library change. */
      .lane .logoTile { width: 56px; height: 56px; border-radius: 14px; overflow: hidden; flex: 0 0 auto; }
      .lane .logoTile.is-dark { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.10); }
      .lane .logoTile img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .lane .name {
        width: 200px; flex: 0 0 auto; text-align: right; font-size: 26px; font-weight: 700;
        text-transform: uppercase; letter-spacing: 0.12em;
        color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .lane .track {
        position: relative; flex: 1 1 auto; height: 62px; border-radius: 18px;
        background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); overflow: hidden;
      }
      .lane .bar {
        position: absolute; left: 0; top: 0; bottom: 0; width: 0%;
        border-radius: 18px; background: rgba(255,239,219,0.35);
      }
      .lane .value {
        position: absolute; right: 20px; top: 50%; transform: translateY(-50%);
        font-size: 26px; font-weight: 800; color: var(--text); text-shadow: 0 1px 6px rgba(0,0,0,0.5);
      }

      .mk { position: relative; display: inline-block; }
      .mk-sweep { position: absolute; left: -8px; right: -8px; bottom: 0; height: 45%; background: var(--accent); transform: scaleX(0); z-index: 0; }
      .mk-text { position: relative; z-index: 1; }

      @keyframes hf-ambient-breathe { from { transform: scale(1); } to { transform: scale(1.012); } }
      #frame { animation: hf-ambient-breathe 6s ease-in-out alternate infinite; /* hf-ambient */ }
    </style>
  </head>
  <body class="register-dark variant-a">
    <div id="root" data-composition-id="race-bars" data-start="0" data-duration="6" data-width="1920" data-height="1080"
      data-composition-variables='{"title":"Runtime Benchmark","products":[{"name":"OpusClip"},{"name":"Submagic"}],"productLogos":["opusclip","submagic"],"beats":[{"values":[{"value":"30"},{"value":"22"}],"at":0.6},{"values":[{"value":"62"},{"value":"48"}],"at":1.9},{"values":[{"value":"78"},{"value":"74"}],"at":3.1},{"values":[{"value":"78"},{"value":"100"}],"at":4.3}]}'>
      <div id="bg" class="clip" data-start="0" data-duration="6" data-track-index="0"></div>
      <div id="frame" class="clip" data-start="0" data-duration="6" data-track-index="1">
        <div id="card">
          <div class="title" id="title"></div>
          <div class="lanes" id="lanes"></div>
        </div>
      </div>
    </div>

    <script>
      /* ===== CONTENT ===== (editor / Gemini edits ONLY this) ===== */
      const DEFAULTS = {
        title: 'Runtime Benchmark',
        products: [{ name: 'OpusClip' }, { name: 'Submagic' }],
        productLogos: ['opusclip', 'submagic'],
        beats: [
          { values: [{ value: '30' }, { value: '22' }], at: 0.6 },
          { values: [{ value: '62' }, { value: '48' }], at: 1.9 },
          { values: [{ value: '78' }, { value: '74' }], at: 3.1 },
          { values: [{ value: '78' }, { value: '100' }], at: 4.3 },
        ],
      };
      const VARS = (window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : null) || {};
      const DATA = {
        title: VARS.title ?? DEFAULTS.title,
        products: (VARS.products ?? DEFAULTS.products).slice(0, 5),
        beats: VARS.beats ?? DEFAULTS.beats,
        register: VARS.register ?? 'dark',
        variant: VARS.variant ?? 'a',
        marker: VARS.marker ?? false,
      };

      if (DATA.register === 'light') document.body.classList.replace('register-dark', 'register-light');
      if (DATA.variant === 'b') document.body.classList.replace('variant-a', 'variant-b');

      /* ===== TIMELINE (LOCKED — do not edit) ===== */
      const $ = (id) => document.getElementById(id);
      const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));
      const ACCENT = '#fb923c';
      const DIM = 'rgba(255,239,219,0.35)';

      const title = $('title');
      title.textContent = DATA.title;

      if (typeof DATA.marker === 'string' && DATA.marker.trim()) {
        const word = DATA.marker.trim();
        const escaped = word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const re = new RegExp('(' + escaped + ')', 'i');
        if (re.test(title.textContent)) {
          title.innerHTML = title.textContent.replace(
            re,
            '<span class="mk"><span class="mk-sweep"></span><span class="mk-text">$1</span></span>'
          );
        }
      }

      const lanesEl = $('lanes');
      const bars = [];
      const valueEls = [];
      const LOGOS = VARS.__logos ?? {};
      const LOGO_DARK = VARS.__logoDark ?? {};
      const logoSlugs = VARS.productLogos ?? DEFAULTS.productLogos ?? [];

      DATA.products.forEach((p, pi) => {
        const lane = document.createElement('div');
        lane.className = 'lane';
        const slug = logoSlugs[pi];
        const logoHtml = slug && LOGOS[slug]
          ? `<div class="logoTile${LOGO_DARK[slug] ? ' is-dark' : ''}"><img src="${LOGOS[slug]}" alt=""></div>`
          : '';
        lane.innerHTML =
          logoHtml +
          '<div class="name"></div>' +
          '<div class="track"><div class="bar"><span class="value"></span></div></div>';
        lane.querySelector('.name').textContent = p.name ?? '';
        lane.querySelector('.value').textContent = '0';
        lanesEl.appendChild(lane);
        bars.push(lane.querySelector('.bar'));
        valueEls.push(lane.querySelector('.value'));
      });
      const finish = document.createElement('div');
      finish.className = 'finish';
      lanesEl.style.position = 'relative';
      lanesEl.appendChild(finish);

      const valueAt = (b, pi) => clamp(parseFloat((b.values && b.values[pi] && b.values[pi].value) || '0') || 0, 0, 100);

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const CHROME_IN = 0.15;
      tl.from('.title', { opacity: 0, y: -24, duration: 0.6, ease: 'power3.out' }, CHROME_IN);
      tl.from('.lanes', { opacity: 0, y: 24, duration: 0.6, ease: 'power3.out' }, CHROME_IN + 0.1);

      const prevVal = DATA.products.map(() => 0);
      DATA.beats.forEach((b, bi) => {
        // widths + judder/stall per product
        DATA.products.forEach((p, pi) => {
          const val = valueAt(b, pi);
          const barEl = bars[pi];
          tl.to(barEl, { width: val + '%', duration: 0.55, ease: 'power2.out' }, b.at);
          // roll the numeric label deterministically off the same tween's own progress
          const counter = { v: prevVal[pi] };
          tl.to(counter, {
            v: val, duration: 0.55, ease: 'power2.out',
            onUpdate: () => { valueEls[pi].textContent = String(Math.round(counter.v)); },
          }, b.at);
          const increased = val > prevVal[pi];
          if (bi > 0 && !increased) {
            tl.to(barEl, { x: -6, duration: 0.05, ease: 'power1.inOut' }, b.at)
              .to(barEl, { x: 6, duration: 0.08, ease: 'power1.inOut' }, b.at + 0.05)
              .to(barEl, { x: 0, duration: 0.05, ease: 'power1.inOut' }, b.at + 0.13)
              .to(barEl, { opacity: 0.45, duration: 0.3, ease: 'power2.out' }, b.at + 0.13);
          } else {
            tl.set(barEl, { opacity: 1 }, b.at);
          }
          prevVal[pi] = val;
        });
        // leading bar recompute
        let leadIdx = -1, leadVal = -1;
        DATA.products.forEach((p, pi) => {
          const val = valueAt(b, pi);
          if (val > leadVal) { leadVal = val; leadIdx = pi; }
        });
        DATA.products.forEach((p, pi) => {
          const isLead = pi === leadIdx;
          tl.set(bars[pi], {
            backgroundColor: isLead ? ACCENT : DIM,
            boxShadow: isLead ? '0 0 24px rgba(251,146,60,0.45)' : 'none',
          }, b.at + 0.001);
        });
      });

      if (title.querySelector('.mk-sweep')) {
        tl.fromTo('.mk-sweep', { scaleX: 0 }, { scaleX: 1, transformOrigin: 'left', duration: 0.35, ease: 'power2.out' }, 0.9);
      }

      window.__timelines['race-bars'] = tl;
    </script>
  </body>
</html>
