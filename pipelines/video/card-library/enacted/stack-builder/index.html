<!doctype html>
<!--
  STACK BUILDER   (Hyperframes enacted card, beat)
  Wide rounded slabs drop from above (bounce ease) and stack bottom-up into a
  column, one per beat; each landing does a tiny squash-and-settle and the new
  block's keyline takes the accent while the previous one dims back. If
  `collapse` is true AND register is dark, the whole stack topples on the final
  beat. Variant b slides blocks in from the side instead of dropping.
  1920x1080, 30fps, 6 seconds.

  EDITOR: change only the ===== CONTENT ===== block (title, beats[]) and the
  :root colors. Do NOT touch ===== TIMELINE (LOCKED). Or render-time:
    --variables '{"title":"Tech Stack","beats":[{"label":"Database","at":1.0}],"collapse":true,"register":"dark"}'
  Render:  npx hyperframes@latest render enacted/stack-builder -o out.mp4 --fps 30
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --bg-from: #3a1f08; --bg-to: #0a0805;
        --text: #ffffff; --text-dim: rgba(255, 239, 219, 0.6);
        --accent: #fb923c;
        --positive: #34d399; --negative: #fb7185; --gold: #facc15;
        --font: 'Inter', system-ui, sans-serif;
      }
      body.register-light {
        --bg-from: #2b2416; --bg-to: #0a0805;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; font-family: var(--font); color: var(--text); }
      #root { position: relative; width: 1920px; height: 1080px; }
      #bg { position: absolute; inset: 0; background: radial-gradient(ellipse at 30% 20%, var(--bg-from) 0%, var(--bg-to) 60%); }
      #frame { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 100px; }
      #card { width: 100%; max-width: 1560px; display: flex; flex-direction: column; align-items: center; }
      .title { font-size: 64px; font-weight: 800; letter-spacing: -2px; text-align: center; margin-bottom: 40px; }

      .mk { position: relative; display: inline-block; }
      .mk-sweep { position: absolute; left: 0; bottom: 0; width: 100%; height: 45%; background: var(--accent); transform: scaleX(0); transform-origin: left; z-index: 0; }
      .mk-text { position: relative; z-index: 1; }

      .stack { position: relative; width: 100%; max-width: 760px; display: flex; flex-direction: column-reverse; gap: 16px; }
      .block { flex: 0 0 auto; width: 100%; height: 108px; border-radius: 20px; display: flex; align-items: center; justify-content: center; border: 2px solid rgba(255,255,255,0.14); box-shadow: 0 12px 26px rgba(0,0,0,0.35); }
      .block .label { font-size: 32px; font-weight: 700; color: var(--text); letter-spacing: -0.5px; }

      @keyframes hf-ambient-breathe { from { transform: scale(1); } to { transform: scale(1.012); } }
      #frame { animation: hf-ambient-breathe 6s ease-in-out alternate infinite; /* hf-ambient */ }
    </style>
  </head>
  <body class="register-dark variant-a">
    <div id="root" data-composition-id="stack-builder" data-start="0" data-duration="6" data-width="1920" data-height="1080"
      data-composition-variables='{"title":"Tech Stack","beats":[{"label":"Database","at":1.0},{"label":"Backend API","at":1.9},{"label":"Cache Layer","at":2.8},{"label":"Frontend","at":3.7}]}'>
      <div id="bg" class="clip" data-start="0" data-duration="6" data-track-index="0"></div>
      <div id="frame" class="clip" data-start="0" data-duration="6" data-track-index="1">
        <div id="card">
          <div class="title" id="title"></div>
          <div class="stack" id="stack"></div>
        </div>
      </div>
    </div>

    <script>
      /* ===== CONTENT ===== (editor / Gemini edits ONLY this) ===== */
      const VARS = (window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : null) || {};
      const DEFAULTS = {
        title: 'Tech Stack',
        beats: [
          { label: 'Database',    at: 1.0 },
          { label: 'Backend API', at: 1.9 },
          { label: 'Cache Layer', at: 2.8 },
          { label: 'Frontend',    at: 3.7 },
        ],
      };
      const DATA = {
        ...DEFAULTS,
        ...VARS,
        register: VARS.register ?? 'dark',
        variant: VARS.variant ?? 'a',
        marker: VARS.marker ?? false,
        collapse: VARS.collapse ?? false,
      };

      if (DATA.register === 'light') document.body.classList.replace('register-dark', 'register-light');
      if (DATA.variant === 'b') document.body.classList.replace('variant-a', 'variant-b');
      const isVariantB = DATA.variant === 'b';
      const isDark = DATA.register === 'dark';
      const willCollapse = !!DATA.collapse && isDark;

      const $ = (id) => document.getElementById(id);
      const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

      const titleEl = $('title');
      if (typeof DATA.marker === 'string' && DATA.marker.trim()) {
        const word = DATA.marker.trim();
        const title = DATA.title;
        const idx = title.toLowerCase().indexOf(word.toLowerCase());
        if (idx !== -1) {
          const before = esc(title.slice(0, idx));
          const match = esc(title.slice(idx, idx + word.length));
          const after = esc(title.slice(idx + word.length));
          titleEl.innerHTML = `${before}<span class="mk"><span class="mk-sweep"></span><span class="mk-text">${match}</span></span>${after}`;
        } else {
          titleEl.textContent = title;
        }
      } else {
        titleEl.textContent = DATA.title;
      }

      /* warm dim tones cycling per block, darkest at the bottom of the visual stack */
      const TONES = [
        'rgba(120,72,32,0.24)',
        'rgba(102,60,28,0.24)',
        'rgba(86,50,24,0.24)',
        'rgba(70,42,20,0.24)',
        'rgba(56,34,16,0.24)',
        'rgba(44,27,13,0.24)',
      ];

      const stackEl = $('stack');
      const beats = (DATA.beats || []).slice().sort((a, b) => a.at - b.at);
      const blockEls = beats.map((b, i) => {
        const block = document.createElement('div');
        block.className = 'block';
        block.style.background = TONES[i % TONES.length];
        block.innerHTML = '<div class="label"></div>';
        block.querySelector('.label').textContent = b.label;
        stackEl.appendChild(block);
        return block;
      });
      /* column-reverse: first appended block sits at the bottom, matching bottom-up beat order */

      /* ===== TIMELINE (LOCKED — do not edit) ===== */
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const CHROME_IN = 0.15;

      tl.from(titleEl, { opacity: 0, y: 24, duration: 0.6, ease: 'power3.out' }, CHROME_IN);

      const DROP_FROM = -900;
      const SLIDE_FROM = 900;

      beats.forEach((b, i) => {
        const block = blockEls[i];
        const at = b.at;

        if (!isVariantB) {
          tl.fromTo(block, { y: DROP_FROM, opacity: 0 }, { y: 0, opacity: 1, duration: 0.65, ease: 'bounce.out' }, at);
        } else {
          const dir = i % 2 === 0 ? SLIDE_FROM : -SLIDE_FROM;
          tl.fromTo(block, { x: dir, opacity: 0 }, { x: 0, opacity: 1, duration: 0.55, ease: 'power3.out' }, at);
        }

        /* squash and settle on landing */
        tl.to(block, { scaleY: 0.86, duration: 0.09, ease: 'power1.out' }, at + 0.56);
        tl.to(block, { scaleY: 1, duration: 0.22, ease: 'power2.out' }, at + 0.65);

        /* newest block takes the accent keyline; the previous one dims back */
        tl.to(block, { borderColor: '#fb923c', boxShadow: '0 0 0 1px rgba(251,146,60,0.35), 0 12px 26px rgba(0,0,0,0.35)', duration: 0.25, ease: 'power2.out' }, at + 0.5);
        if (i > 0) {
          tl.to(blockEls[i - 1], { borderColor: 'rgba(255,255,255,0.14)', boxShadow: '0 12px 26px rgba(0,0,0,0.35)', duration: 0.3, ease: 'power2.out' }, at + 0.5);
        }
      });

      if (willCollapse && beats.length) {
        const lastAt = beats[beats.length - 1].at;
        const collapseStart = lastAt + 1.0;
        blockEls.forEach((block, i) => {
          const dir = i % 2 === 0 ? -1 : 1;
          tl.to(block, {
            y: '+=760',
            x: dir * (140 + i * 30),
            rotation: dir * (18 + i * 4),
            opacity: 0.15,
            duration: 0.8,
            ease: 'power2.in',
          }, collapseStart + i * 0.06);
        });
      }

      if (typeof DATA.marker === 'string' && DATA.marker.trim() && titleEl.querySelector('.mk-sweep')) {
        tl.fromTo('.mk-sweep', { scaleX: 0 }, { scaleX: 1, transformOrigin: 'left', duration: 0.35, ease: 'power2.out' }, 0.9);
      }

      window.__timelines['stack-builder'] = tl;
    </script>
  </body>
</html>
