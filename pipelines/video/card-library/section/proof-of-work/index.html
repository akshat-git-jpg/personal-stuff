<!doctype html>
<!--
  PROOF OF WORK
  Why the viewer should believe the comparison — the test setup.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --bg-from: #3a1f08; 
        --bg-to: #0a0805;
        --text: #ffffff; 
        --text-dim: rgba(255, 239, 219, 0.6);
        --accent: #fb923c;
        --positive: #34d399; 
        --negative: #ef4444; 
        --gold: #facc15;
        --font: 'Inter', system-ui, sans-serif;
      }
      
      * { 
        margin: 0; 
        padding: 0; 
        box-sizing: border-box; 
      }
      
      html, body { 
        width: 100%; 
        height: 1080px; 
        overflow: hidden; 
        background: #000; 
        font-family: var(--font); 
        color: var(--text); 
      }
      
      #root { 
        position: relative; 
        width: 100%; 
        height: 1080px; 
      }
      
      #bg { 
        position: absolute; 
        inset: 0; 
        background: radial-gradient(ellipse at 30% 20%, var(--bg-from) 0%, var(--bg-to) 60%); 
      }
      
      #frame { 
        position: absolute; 
        inset: 0; 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        justify-content: center; 
        padding: 120px; 
      }
      
      .method-caption { 
        font-size: 56px; 
        font-weight: 700; 
        color: rgba(255, 255, 255, 0.5); 
        margin-bottom: 80px; 
        text-transform: uppercase; 
        letter-spacing: -0.035em; 
      }
      
      .facts-row { 
        display: flex; 
        gap: 120px; 
        justify-content: center; 
        align-items: baseline; 
      }
      
      .stat-plate { 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        gap: 16px; 
        text-align: center; 
      }
      
      .stat-value { 
        font-size: 140px; 
        font-weight: 900; 
        line-height: 1; 
        color: var(--text); 
        font-variant-numeric: tabular-nums; 
      }
      
      .stat-value.accented { 
        color: var(--accent); 
        text-shadow: 0 0 40px rgba(251, 146, 60, 0.3); 
      }
      
      .stat-label { 
        font-size: 40px; 
        font-weight: 500; 
        color: var(--text); 
        max-width: 240px; 
        line-height: 1.2; 
      }

      @keyframes hf-ambient-breathe { 
        from { transform: scale(1); } 
        to { transform: scale(1.012); } 
      }
      #frame { 
        animation: hf-ambient-breathe 6s ease-in-out alternate infinite; /* hf-ambient */ 
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="proof-of-work" data-start="0" data-duration="8" data-width="1920" data-height="1080"
      data-composition-variables='{"method":"Same Footage, Both Tools","facts":[{"value":"1","label":"long-form video"},{"value":"2","label":"tools tested"},{"value":"0","label":"manual fixes allowed"}]}'>
      <div id="bg" class="clip" data-start="0" data-duration="8" data-track-index="0"></div>
      <div id="frame" class="clip" data-start="0" data-duration="8" data-track-index="1">
        <div class="method-caption" id="method"></div>
        <div class="facts-row" id="facts"></div>
      </div>
    </div>

    <script>
      /* ===== CONTENT ===== */
      const VARS = (window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : null) || {};
      const DEFAULTS = {
        method: "Same Footage, Both Tools",
        facts: [
          { value: "1", label: "long-form video" },
          { value: "2", label: "tools tested" },
          { value: "0", label: "manual fixes allowed" }
        ],
        accent_index: 1
      };
      const DATA = { ...DEFAULTS, ...VARS };

      const $ = (id) => document.getElementById(id);
      
      $('method').textContent = DATA.method;
      
      const factsEl = $('facts');
      
      const elements = (DATA.facts || []).map((f, i) => {
        const plate = document.createElement('div');
        plate.className = 'stat-plate';
        plate.id = 'plate-' + i;
        
        const val = document.createElement('div');
        val.className = 'stat-value';
        if (i === DATA.accent_index) {
          val.classList.add('accented');
        }
        val.id = 'val-' + i;
        val.textContent = "0"; // Will count up from 0
        
        const lbl = document.createElement('div');
        lbl.className = 'stat-label';
        lbl.textContent = f.label;
        
        plate.appendChild(val);
        plate.appendChild(lbl);
        factsEl.appendChild(plate);
        
        return {
          plate,
          valEl: val,
          targetValue: f.value
        };
      });

      /* ===== TIMELINE (LOCKED) ===== */
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      
      // Caption enters first
      tl.fromTo('.method-caption', { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 0.2);
      
      // Stat plates animate in on beats
      // Test samples at 1.5, 4.0, 6.0
      // We will introduce facts around 1.0, 3.0, 5.0
      elements.forEach((el, i) => {
        const at = 0.8 + i * 2.0;
        
        // 1. Reveal plate
        tl.fromTo(el.plate, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, at);
        
        // 2. Count up logic
        const numVal = parseInt(el.targetValue, 10);
        if (!isNaN(numVal)) {
          const counter = { val: 0 };
          tl.to(counter, {
            val: numVal,
            duration: 0.8,
            ease: 'power2.out',
            onUpdate: function() {
              el.valEl.textContent = Math.round(counter.val).toString();
            }
          }, at + 0.2);
        } else {
          // If it's not a number, just set the text abruptly or keep it static?
          // The instructions say "count up on their beats".
          // If value is somehow text, just dump it in.
          tl.add(() => {
            el.valEl.textContent = el.targetValue;
          }, at + 0.2);
        }
      });

      // Ensure the timeline plays through completely
      window.__timelines['proof-of-work'] = tl;
    </script>
  </body>
</html>
