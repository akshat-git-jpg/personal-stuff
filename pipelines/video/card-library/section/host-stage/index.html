<!doctype html>
<!--
  HOST STAGE   (Hyperframes card)
  Host makes a point to camera while supporting chips land beside them.
  1920x1080, 30fps.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --bg-from: #1f0b3a; --bg-to: #05040a;
        --text: #ffffff; --text-dim: rgba(219, 230, 255, 0.6);
        --accent: #923cfb;
        --font: 'Inter', system-ui, sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; font-family: var(--font); color: var(--text); }
      #root { position: relative; width: 1920px; height: 1080px; }
      #bg { position: absolute; inset: 0; background: radial-gradient(ellipse at 30% 20%, var(--bg-from) 0%, var(--bg-to) 60%); }
      #frame { position: absolute; inset: 0; display: flex; align-items: stretch; padding: 120px; }
      
      .left-col {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: flex-start;
        padding-right: 60px;
        max-width: 1000px;
      }

      .eyebrow {
        font-size: 20px;
        font-weight: 800;
        text-transform: uppercase;
        color: var(--accent);
        letter-spacing: 2px;
        margin-bottom: 24px;
      }

      .title {
        font-size: 84px;
        font-weight: 900;
        letter-spacing: -1.5px;
        line-height: 1.1;
        margin-bottom: 48px;
        max-width: 100%;
      }

      .points-container {
        display: flex;
        flex-direction: column;
        gap: 24px;
      }

      .point-chip {
        padding: 16px 32px;
        background: rgba(255,255,255,0.05);
        border: 2px solid rgba(255,255,255,0.1);
        border-left: 4px solid var(--accent);
        border-radius: 12px;
        font-size: 28px;
        font-weight: 600;
        color: var(--text);
        max-width: 100%;
      }

      .right-col {
        width: calc(1920px * 0.34);
        margin-left: auto;
        display: flex;
        align-items: center;
      }

      .head-zone {
        position: absolute;
        left: calc(1920px * 0.58);
        top: calc(1080px * 0.20);
        width: calc(1920px * 0.34);
        height: calc(1080px * 0.60);
        border: 2px solid rgba(255,255,255,0.1);
        border-radius: 24px;
        box-shadow: inset 0 0 40px rgba(146,60,251,0.1);
      }

      @keyframes hf-ambient-breathe { from { transform: scale(1); } to { transform: scale(1.012); } }
      #frame { animation: hf-ambient-breathe 6s ease-in-out alternate infinite; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="hoststage" data-start="0" data-duration="8" data-width="1920" data-height="1080"
      data-composition-variables='{"eyebrow":"Eyebrow","title":"Section Title","beats":[{"text":"Point one","at":0.5},{"text":"Point two","at":1.0},{"text":"Point three","at":1.5}]}'>
      <div id="bg" class="clip" data-start="0" data-duration="8" data-track-index="0"></div>
      <div id="frame" class="clip" data-start="0" data-duration="8" data-track-index="1">
        <div class="left-col">
          <div class="eyebrow" id="eyebrow"></div>
          <div class="title" id="title"></div>
          <div class="points-container" id="points"></div>
        </div>
        <div class="head-zone" id="head-zone"></div>
      </div>
    </div>
    <script>
      /* ===== CONTENT ===== */
      const VARS = (window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : null) || {};
      const DATA = {
        eyebrow: VARS.eyebrow ?? 'ARCHITECTURE',
        title: VARS.title ?? 'Distributed Systems',
        beats: VARS.beats ?? [
          { text: 'CAP Theorem', at: 0.5 },
          { text: 'Eventual Consistency', at: 1.0 },
          { text: 'Leader Election', at: 1.5 }
        ]
      };
      
      document.getElementById('eyebrow').textContent = DATA.eyebrow;
      document.getElementById('title').textContent = DATA.title;
      
      const pointsContainer = document.getElementById('points');
      const items = DATA.beats.map((b) => {
        const div = document.createElement('div');
        div.className = 'point-chip';
        div.textContent = b.text;
        pointsContainer.appendChild(div);
        return { b, item: div };
      });

      /* ===== TIMELINE (LOCKED) ===== */
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      
      tl.from('#eyebrow', { opacity: 0, duration: 0.5, ease: 'power2.out' }, 0.1);
      tl.from('#title', { opacity: 0, y: 24, duration: 0.6, ease: 'power3.out' }, 0.2);
      
      items.forEach(({ b, item }) => {
        tl.from(item, { opacity: 0, x: -20, duration: 0.5, ease: 'power3.out' }, b.at);
      });

      window.__timelines['hoststage'] = tl;
    </script>
  </body>
</html>
