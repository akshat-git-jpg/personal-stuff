<!doctype html>
<!--
  KEYWORD POP   (Hyperframes OVERLAY — transparent background)
  A compact Loop-Studio-style pill that snaps in near a corner over screen-recording
  footage: tiny uppercase kicker, one bold keyword/phrase, an accent bar that sweeps
  in after the text lands. Minimal replacement for the retired big callout box.
  1920x1080, 30fps, 5 seconds.

  ┌─────────────────────────────────────────────────────────────────────────┐
  │  EDITOR: edit only the  ===== CONTENT =====  block + :root. pos picks    │
  │  the corner (top-left|top-right|bottom-left|bottom-right). Never touch   │
  │  the TIMELINE.                                                           │
  └─────────────────────────────────────────────────────────────────────────┘

  ⚠ OVERLAY: render TRANSPARENT (alpha) so it composites over footage. In the render
  tool, pick the transparent/MOV toggle. From the CLI use --format mov (ProRes 4444
  carries alpha; plain WebM/MP4 here come out opaque on a black frame):
    npx hyperframes@latest render overlay/keyword-pop -o keyword-pop.mov --format mov --fps 30
  Override: --variables '{"text":"100+ models","kicker":"OpenArt","pos":"top-right","variant":"a"}'
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --accent: #fb923c;
        --plate: rgba(15, 11, 7, 0.88);
        --text: #ffffff;
        --font: 'Inter', system-ui, sans-serif;
        --inset: 100px;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; font-family: var(--font); color: var(--text); }
      #root { position: relative; width: 1920px; height: 1080px; }

      /* corner anchor — ambient wrapper */
      #pin { position: absolute; will-change: transform; }
      #root[data-pos="top-left"]     #pin { top: var(--inset); left: var(--inset); }
      #root[data-pos="top-right"]    #pin { top: var(--inset); right: var(--inset); }
      #root[data-pos="bottom-left"]  #pin { bottom: var(--inset); left: var(--inset); }
      #root[data-pos="bottom-right"] #pin { bottom: var(--inset); right: var(--inset); }

      /* the chip — thin dark plate sized to content, never a band */
      #chip { position: relative; display: flex; flex-direction: column; gap: 7px; width: max-content;
        background: var(--plate); border: 1px solid rgba(255,255,255,0.10); border-radius: 16px;
        padding: 18px 28px 20px; box-shadow: 0 18px 44px rgba(0,0,0,0.38);
        will-change: transform, opacity; }
      .kicker { font-size: 20px; font-weight: 800; letter-spacing: 3px; text-transform: uppercase;
        color: var(--accent); white-space: nowrap; will-change: transform, opacity; }
      .main { display: flex; flex-direction: column; align-items: flex-start; gap: 9px; }
      .word { font-size: 48px; font-weight: 800; letter-spacing: -1px; line-height: 1.05;
        color: var(--text); white-space: nowrap; will-change: transform, opacity; }
      /* variant a accent: underline sweeps left→right under the word */
      .underline { height: 4px; width: 100%; border-radius: 2px; background: var(--accent);
        transform: scaleX(0); transform-origin: left center; will-change: transform; }
      /* variant b accent: side-tick sweeps down the chip's left edge */
      .tick { display: none; position: absolute; left: 12px; top: 16px; bottom: 16px; width: 4px;
        border-radius: 2px; background: var(--accent); transform: scaleY(0); transform-origin: center top;
        will-change: transform; }

      body.variant-b .underline { display: none; }
      body.variant-b .tick { display: block; }
      body.variant-b #chip { padding-left: 34px; }

      @keyframes hf-ambient-breathe { from { transform: scale(1); } to { transform: scale(1.012); } }
      #pin { animation: hf-ambient-breathe 6s ease-in-out alternate infinite; /* hf-ambient */ }
    </style>
  </head>
  <body class="variant-a">
    <div id="root" data-composition-id="keyword-pop" data-start="0" data-duration="5" data-width="1920" data-height="1080" data-pos="top-right"
      data-composition-variables='{"text":"100+ models","kicker":"OpenArt","pos":"top-right","variant":"a"}'>
      <div id="pin" class="clip" data-start="0" data-duration="5" data-track-index="0">
        <div id="chip">
          <div class="tick" id="tick"></div>
          <span class="kicker" id="kicker"></span>
          <div class="main">
            <span class="word" id="word"></span>
            <div class="underline" id="underline"></div>
          </div>
        </div>
      </div>
    </div>

    <script>
      /* ===== CONTENT ===== */
      const VARS = (window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : null) || {};
      const DATA = {
        text: VARS.text ?? '100+ models',      // the keyword/phrase, <= 5 words
        kicker: VARS.kicker ?? 'OpenArt',      // optional tiny eyebrow; '' hides it
        pos: VARS.pos ?? 'top-right',          // top-left | top-right | bottom-left | bottom-right
        variant: VARS.variant ?? 'a',
      };

      if (DATA.variant === 'b') document.body.classList.replace('variant-a', 'variant-b');

      const root = document.getElementById('root');
      root.dataset.pos = ['top-left', 'top-right', 'bottom-left', 'bottom-right'].includes(DATA.pos) ? DATA.pos : 'top-right';
      document.getElementById('word').textContent = DATA.text;
      const kickerEl = document.getElementById('kicker');
      kickerEl.textContent = DATA.kicker || '';
      if (!DATA.kicker) kickerEl.style.display = 'none';

      /* ===== TIMELINE (LOCKED) ===== */
      // pop from the corner the chip is anchored to
      const ORIGINS = { 'top-left': '0% 0%', 'top-right': '100% 0%', 'bottom-left': '0% 100%', 'bottom-right': '100% 100%' };
      const chipOrigin = ORIGINS[root.dataset.pos];

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // plate snaps in with a scale pop
      tl.fromTo('#chip', { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.35, ease: 'back.out(1.7)', transformOrigin: chipOrigin }, 0.1);
      // kicker fades in
      if (DATA.kicker) tl.from('#kicker', { opacity: 0, y: -8, duration: 0.35, ease: 'power2.out' }, 0.28);
      // main text slides 12px
      tl.from('#word', { opacity: 0, x: -12, duration: 0.4, ease: 'power2.out' }, 0.34);
      // accent sweeps: underline (a) or side-tick (b)
      if (DATA.variant === 'b') {
        tl.to('#tick', { scaleY: 1, duration: 0.3, ease: 'power2.out' }, 0.6);
      } else {
        tl.to('#underline', { scaleX: 1, duration: 0.3, ease: 'power2.out' }, 0.6);
      }
      // gentle idle float so it never freezes (deterministic yoyo inside the paused timeline)
      tl.to('#chip', { y: -4, duration: 0.95, ease: 'sine.inOut', yoyo: true, repeat: 3 }, 1.2);
      window.__timelines['keyword-pop'] = tl;
    </script>
  </body>
</html>
