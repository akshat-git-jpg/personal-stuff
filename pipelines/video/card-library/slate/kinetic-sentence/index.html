<!doctype html>
<!--
  KINETIC SENTENCE   (Hyperframes card)
  A canvas slate: one spoken sentence alone on the ambient canvas; words appear as spoken
  and an accent phrase colorizes with them.
  1920x1080, 30fps, 6s.

  ┌─────────────────────────────────────────────────────────────────────────┐
  │  EDITOR: edit only the  ===== CONTENT =====  block (text, accent,       │
  │  beats) and :root. Never touch the TIMELINE.                            │
  └─────────────────────────────────────────────────────────────────────────┘

  Render:  npx hyperframes@latest render slate/kinetic-sentence -o out.mp4 --fps 30
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --bg-from: #3a1f08; --bg-to: #0a0805;
        --text: #ffffff;
        --accent: #fb923c;
        --font: 'Inter', system-ui, sans-serif;
        --hero-size: 64px; /* base only — the script rescales by word count (owner fold 2026-07-31):
                              <=8 words → 120px, 9-12 → 96px, >12 → this 64px legacy fallback.
                              A statement must LOOK like a statement; the R_KINETIC word cap (<=12,
                              core clause of a long sentence) is what makes the big buckets safe.
                              History: 148px on an 18-word sentence ran three lines edge-to-edge
                              (rejected 2026-07-25); 64px on the same length read as "a paragraph,
                              not a statement" (rejected 2026-07-31). The variable is words x size. */
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 1080px; overflow: hidden; background: #000; font-family: var(--font); color: var(--text); }
      #root { position: relative; width: 100%; height: 1080px; }
      #bg { position: absolute; inset: -10%; background: radial-gradient(ellipse at 30% 20%, var(--bg-from) 0%, var(--bg-to) 60%); will-change: transform; }
      #frame { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 180px; }
      #sentence { font-size: var(--hero-size); font-weight: 800; line-height: 1.25; letter-spacing: -0.02em; color: var(--text); max-width: 1560px; text-align: center; }
      .word { display: inline-block; white-space: pre-wrap; will-change: opacity, color; }
      /* the runtime GSAP timeline (locked) colors the accent word(s) via inline
         style at the scheduled beat; this class documents the same accent-text
         contract statically so the card declares it even before the tween runs. */
      .word.is-accent { color: var(--accent); }
    
      @keyframes hf-ambient-breathe { from { transform: scale(1); } to { transform: scale(1.012); } }
      #frame { animation: hf-ambient-breathe 6s ease-in-out alternate infinite; /* hf-ambient */ }
</style>
  </head>
  <body>
    <div id="root" data-composition-id="kineticsentence" data-start="0" data-duration="6" data-width="1920" data-height="1080"
      data-composition-variables='{"text":"Because picking the wrong model just burns credits","accent":"burns credits","beats":[{"text":"Because","accent":false,"at":0.0},{"text":"picking","accent":false,"at":0.35},{"text":"the","accent":false,"at":0.62},{"text":"wrong","accent":false,"at":0.8},{"text":"model","accent":false,"at":1.15},{"text":"just","accent":false,"at":1.5},{"text":"burns","accent":true,"at":1.75},{"text":"credits","accent":true,"at":2.1}]}'>
      <div id="bg" class="clip" data-start="0" data-duration="6" data-track-index="0"></div>
      <div id="frame" class="clip" data-start="0" data-duration="6" data-track-index="1">
        <div id="sentence"></div>
      </div>
    </div>

    <script>
      /* ===== CONTENT ===== */
      const VARS = (window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : null) || {};
      const DATA = {
        text: VARS.text ?? "Because picking the wrong model just burns credits",
        accent: VARS.accent ?? "burns credits",
        beats: VARS.beats ?? [
          {"text":"Because","accent":false,"at":0.0},
          {"text":"picking","accent":false,"at":0.35},
          {"text":"the","accent":false,"at":0.62},
          {"text":"wrong","accent":false,"at":0.8},
          {"text":"model","accent":false,"at":1.15},
          {"text":"just","accent":false,"at":1.5},
          {"text":"burns","accent":true,"at":1.75},
          {"text":"credits","accent":true,"at":2.1}
        ]
      };

      // Statement size buckets — see the --hero-size comment in :root.
      const wordCount = (DATA.beats || []).length;
      const bucket = wordCount <= 8 ? { size: 120, leading: 1.1 }
                   : wordCount <= 12 ? { size: 96, leading: 1.15 }
                   : { size: 64, leading: 1.25 };
      document.documentElement.style.setProperty('--hero-size', bucket.size + 'px');

      /* ===== TIMELINE (LOCKED) ===== */
      const sentenceEl = document.getElementById('sentence');
      sentenceEl.style.lineHeight = bucket.leading;
      // Accent color is applied at BUILD time as an INLINE LITERAL, resolved
      // from the live --accent token via getComputedStyle — never as a GSAP
      // color tween and never as `var(--accent)` on the span. Verified
      // 2026-07-31 against the render pipeline: in a --variables render the
      // accent words came out white with (a) a color tween to var(--accent),
      // (b) a static `.is-accent { color: var(--accent) }` class, and
      // (c) inline `style.color = 'var(--accent)'` — while getComputedStyle
      // resolved the token correctly and an inline literal rendered orange.
      // The browser and the board show all four variants correctly, so only a
      // rendered frame catches this. The word still reveals at its beat via
      // its opacity tween, already colored.
      const ACCENT = (getComputedStyle(document.documentElement).getPropertyValue('--accent') || '').trim() || '#fb923c';
      const words = DATA.beats.map((b, i) => {
        const span = document.createElement('span');
        span.className = b.accent ? 'word is-accent' : 'word';
        span.textContent = b.text + (i < DATA.beats.length - 1 ? ' ' : '');
        span.style.opacity = 0;
        if (b.accent) span.style.color = ACCENT;
        sentenceEl.appendChild(span);
        return { b, span };
      });

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      
      tl.to('#bg', { scale: 1.05, x: -20, y: -10, duration: 6, ease: 'none' }, 0);

      words.forEach(({ b, span }) => {
        const at = Number(b.at);
        tl.to(span, { opacity: 1, duration: 0.1, ease: 'none' }, at);
      });
      
      window.__timelines['kineticsentence'] = tl;
    </script>
  </body>
</html>
