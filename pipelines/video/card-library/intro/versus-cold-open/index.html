<!doctype html>
<!--
  INTRO · Versus Cold Open   (Hyperframes card)
  Purpose-built comparison intro (owner commission 2026-07-31, opusclip-vs-submagic
  final-v4:0): one continuous composition that ENACTS the hook in two acts and
  lands on the matchup.

    Act 1 — the pain: a film strip of clip cards drifts toward a closed POSTED
    slot; as the VO names each pain, an orange stamp hits its card in word-sync
    and knocks it askew. The strip never reaches the slot.
    Act 2 — the matchup (fired by the beat labelled with `marker`): the strip
    sweeps out, two hero tiles land — the products, VS badge — and breathe
    until the next card takes over.

  Look is locked to the owner-approved Gemini previews (2026-07-31): flat
  matte panels on near-black warm brown, single soft glow upper-left, one
  accent (orange), Swiss/Apple-keynote minimalism. No 3D, no flares, no
  sparkles.

  ┌─────────────────────────────────────────────────────────────────────────┐
  │  EDITOR: you ONLY ever touch the  ===== CONTENT =====  block and the     │
  │  :root colors. Do NOT touch the  ===== TIMELINE (LOCKED) =====  script.  │
  └─────────────────────────────────────────────────────────────────────────┘
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Versus Cold Open</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --bg: #0d0906;
        --accent: #fb923c;
        --text: #ffffff;
        --dim: rgba(255, 255, 255, 0.62);
        --panel: #17110b;
        --keyline: rgba(251, 146, 60, 0.6);
        --font: 'Inter', 'Helvetica Neue', Arial, system-ui, sans-serif;
        --hero-size: 52px; /* the product names — this card has no headline */
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 1080px; overflow: hidden; font-family: var(--font); color: var(--text); background: var(--bg); }
      #root { position: relative; width: 100%; height: 1080px; }
      #bg { position: absolute; inset: 0; background:
        radial-gradient(circle at 18% 20%, rgba(251,146,60,0.14) 0%, transparent 52%),
        var(--bg); }

      /* ===== Act 1 — the strip and the slot ===== */
      #act1 { position: absolute; inset: 0; }
      #strip { position: absolute; left: 0; right: 200px; top: 600px; height: 260px;
        display: flex; gap: 44px; justify-content: center; will-change: transform; }
      .clipcard { position: relative; width: 300px; height: 200px; border-radius: 16px;
        background: var(--panel); border: 2px solid var(--keyline);
        box-shadow: 0 10px 26px rgba(0,0,0,0.45); overflow: hidden; will-change: transform, opacity; }
      .clipcard .thumb { position: absolute; inset: 0; opacity: 0.5; }
      .clipcard:nth-child(1) .thumb { background: radial-gradient(circle at 30% 40%, rgba(251,146,60,0.22), transparent 70%), linear-gradient(140deg, #221609 0%, #0f0a05 100%); }
      .clipcard:nth-child(2) .thumb { background: radial-gradient(circle at 70% 30%, rgba(255,255,255,0.10), transparent 65%), linear-gradient(200deg, #1d130a 0%, #100b06 100%); }
      .clipcard:nth-child(3) .thumb { background: radial-gradient(circle at 45% 70%, rgba(251,146,60,0.16), transparent 70%), linear-gradient(120deg, #241809 0%, #0e0904 100%); }
      .clipcard:nth-child(4) .thumb { background: radial-gradient(circle at 25% 25%, rgba(255,255,255,0.08), transparent 60%), linear-gradient(160deg, #1a1108 0%, #0f0a05 100%); }
      .clipcard:nth-child(5) .thumb { background: radial-gradient(circle at 65% 60%, rgba(251,146,60,0.18), transparent 65%), linear-gradient(220deg, #20150a 0%, #0d0905 100%); }

      .stamp { position: absolute; left: 50%; top: 50%; padding: 12px 22px;
        border: 3px solid var(--accent); border-radius: 8px; color: var(--accent);
        font-size: 34px; font-weight: 800; letter-spacing: 0.06em; white-space: nowrap;
        text-transform: uppercase; background: rgba(13,9,6,0.55);
        transform: translate(-50%, -50%) rotate(-6deg); opacity: 0; will-change: transform, opacity; }

      #slot { position: absolute; right: 64px; top: 560px; width: 120px; height: 340px;
        border-radius: 18px; background: var(--panel); border: 2px solid var(--keyline);
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5); will-change: transform, opacity; }
      #slot .label { writing-mode: vertical-rl; transform: rotate(180deg);
        font-size: 44px; font-weight: 800; letter-spacing: 0.14em; color: var(--text); }

      /* ===== Act 2 — the matchup ===== */
      #act2 { position: absolute; inset: 0; }
      #stage { position: absolute; left: 0; right: 0; top: 300px;
        display: flex; justify-content: center; align-items: flex-start; gap: 200px; }
      .hero { display: flex; flex-direction: column; align-items: center; will-change: transform, opacity; opacity: 0; }
      .tile { width: 300px; height: 300px; border-radius: 32px; background: rgba(255,255,255,0.045);
        border: 2px solid var(--keyline); display: flex; align-items: center; justify-content: center;
        box-shadow: 0 18px 48px rgba(0,0,0,0.42); }
      .tile img { width: 58%; height: 58%; object-fit: contain; }
      .tile .fallback { font-size: 96px; font-weight: 800; color: var(--dim); }
      .hero .name { margin-top: 34px; font-size: var(--hero-size); font-weight: 700; letter-spacing: -0.015em; }

      #vsWrap { position: absolute; left: 50%; top: 420px; transform: translateX(-50%);
        will-change: transform, opacity; opacity: 0; }
      #vs { width: 108px; height: 108px; border-radius: 50%; background: rgba(13,9,6,0.9);
        border: 2.5px solid var(--accent); display: flex; align-items: center; justify-content: center;
        font-size: 40px; font-weight: 800; color: var(--accent); letter-spacing: 0.04em; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="versus-cold-open"
      data-start="0"
      data-duration="18"
      data-width="1920"
      data-height="1080"
      data-composition-variables='{"platforms":[{"name":"Submagic","logo":"submagic"},{"name":"OpusClip","logo":"opusclip"}],"pains":[{"label":"Captions"},{"label":"Pacing"},{"label":"Layouts"}],"marker":"VS","beats":[{"label":"Captions","at":5.8},{"label":"Pacing","at":7.7},{"label":"Layouts","at":8.8},{"label":"VS","at":12.4}]}'
    >
      <div id="bg" class="clip" data-start="0" data-duration="18" data-track-index="0"></div>
      <div id="frame" class="clip" data-start="0" data-duration="18" data-track-index="1">
        <div id="act1">
          <div id="strip"></div>
          <div id="slot"><span class="label">POSTED</span></div>
        </div>
        <div id="act2">
          <div id="stage"></div>
          <div id="vsWrap"><div id="vs">VS</div></div>
        </div>
      </div>
    </div>

    <script>
      /* ===== CONTENT ===== (editor edits ONLY this) */
      const VARS =
        (window.__hyperframes && window.__hyperframes.getVariables
          ? window.__hyperframes.getVariables()
          : null) || {};
      const DATA = {
        platforms: VARS.platforms ?? [
          { name: 'Submagic', logo: 'submagic' },
          { name: 'OpusClip', logo: 'opusclip' },
        ],
        pains: VARS.pains ?? [{ label: 'Captions' }, { label: 'Pacing' }, { label: 'Layouts' }],
        marker: VARS.marker ?? 'VS',
        // Word-anchored beats [{label, at}] — pain labels stamp their clip in
        // sync; the beat matching `marker` fires Act 2 (the sweep + matchup).
        beats: Array.isArray(VARS.beats) ? VARS.beats : null,
      };

      /* ===== TIMELINE (LOCKED — do not edit) ===== */
      const $ = (id) => document.getElementById(id);
      const LOGOS = VARS.__logos ?? {};
      const CLIP_COUNT = 5;
      // Pains stamp the middle cards, spread across the strip.
      const STAMP_SLOTS = [1, 2, 3];

      function build() {
        const strip = $('strip');
        strip.innerHTML = Array.from({ length: CLIP_COUNT }, (_, i) => `
          <div class="clipcard" data-i="${i}">
            <div class="thumb"></div>
            ${STAMP_SLOTS.includes(i) && DATA.pains[STAMP_SLOTS.indexOf(i)]
              ? `<div class="stamp" data-pain="${DATA.pains[STAMP_SLOTS.indexOf(i)].label}">${DATA.pains[STAMP_SLOTS.indexOf(i)].label}</div>`
              : ''}
          </div>`).join('');

        $('stage').innerHTML = DATA.platforms.slice(0, 2).map((p) => {
          const src = LOGOS[p.logo];
          const logo = src
            ? `<img src="${src}" alt="">`
            : `<span class="fallback">${(p.name || '?')[0]}</span>`;
          return `<div class="hero"><div class="tile">${logo}</div><div class="name">${p.name || ''}</div></div>`;
        }).join('');
      }
      build();

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const cards = gsap.utils.toArray('.clipcard');
      const heroes = gsap.utils.toArray('.hero');
      const beats = DATA.beats ?? [];
      const painAt = (label, fallback) => beats.find((b) => b.label === label)?.at ?? fallback;
      const act2At = beats.find((b) => b.label === DATA.marker)?.at ?? 12;

      // Act 1 — strip and slot enter, then drift right toward POSTED.
      tl.set('#act2', { visibility: 'hidden' }, 0);
      tl.fromTo('#slot', { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.6, ease: 'power3.out' }, 0.15);
      tl.fromTo(cards, { opacity: 0, y: 46 }, { opacity: 1, y: 0, duration: 0.6, stagger: 0.1, ease: 'power3.out' }, 0.2);
      tl.fromTo('#strip', { x: -60 }, { x: 90, duration: Math.max(6, act2At - 0.4), ease: 'none' }, 0.2);

      // Each pain stamps its card in word-sync and knocks it askew.
      DATA.pains.forEach((p, i) => {
        const at = painAt(p.label, 5 + i * 1.5);
        const card = cards[STAMP_SLOTS[i]];
        if (!card) return;
        const stamp = card.querySelector('.stamp');
        if (!stamp) return;
        tl.fromTo(stamp, { opacity: 0, scale: 1.9, rotate: -6 }, { opacity: 1, scale: 1.0, duration: 0.22, ease: 'power4.in' }, at);
        tl.to(card, { rotate: i % 2 ? 3 : -3, y: 6, duration: 0.18, ease: 'power2.out' }, at + 0.1);
      });

      // Act 2 — the sweep: strip and slot leave, the matchup lands.
      tl.to('#strip', { x: -1100, opacity: 0, duration: 0.55, ease: 'power3.in' }, act2At);
      tl.to('#slot', { x: 220, opacity: 0, duration: 0.5, ease: 'power3.in' }, act2At);
      tl.set('#act2', { visibility: 'visible' }, act2At + 0.35);
      tl.fromTo(heroes[0], { opacity: 0, x: -70, scale: 0.92 }, { opacity: 1, x: 0, scale: 1, duration: 0.65, ease: 'power4.out' }, act2At + 0.4);
      tl.fromTo(heroes[1], { opacity: 0, x: 70, scale: 0.92 }, { opacity: 1, x: 0, scale: 1, duration: 0.65, ease: 'power4.out' }, act2At + 0.45);
      tl.fromTo('#vsWrap', { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.5, ease: 'back.out(2.2)' }, act2At + 0.85);

      // Breathing hold — bounded repeats (an infinite tween breaks the
      // frame-seeking renderer: "Set maximum size exceeded").
      tl.to(heroes, { y: -8, duration: 1.7, ease: 'sine.inOut', yoyo: true, repeat: 12, stagger: 0.22 }, act2At + 1.4);
      tl.to('#vs', { boxShadow: '0 0 26px rgba(251,146,60,0.35)', duration: 1.4, ease: 'sine.inOut', yoyo: true, repeat: 12 }, act2At + 1.4);

      window.__timelines['versus-cold-open'] = tl;
    </script>
  </body>
</html>
