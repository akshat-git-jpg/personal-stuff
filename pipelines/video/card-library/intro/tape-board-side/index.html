<!doctype html>
<!--
  INTRO · Tape Board (side)   (Hyperframes card)
  Owner-commissioned side-mode intro (2026-07-31, opusclip-vs-submagic v5 fold):
  the full-height HOST occupies the right 720px (a side-mode avatar span
  composited by the assembler); this card owns the LEFT 1200px with a
  tale-of-the-tape board — the two brand marks face each other up top and the
  spoken pain rows slide in word-synced beneath them. The host carries the
  life; the board stays standard and rich.

  Content is CONSTRAINED TO THE LEFT 1200px on purpose — the right 720px is
  background only, because the side avatar covers it. When the host span ends
  a moment before the next card, the board simply breathes over the intact
  background.

  ┌─────────────────────────────────────────────────────────────────────────┐
  │  EDITOR: you ONLY ever touch the  ===== CONTENT =====  block and the     │
  │  :root colors. Do NOT touch the  ===== TIMELINE (LOCKED) =====  script.  │
  └─────────────────────────────────────────────────────────────────────────┘
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Tape Board (side)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --bg: #0d0906;
        --accent: #fb923c;
        --text: #ffffff;
        --dim: rgba(255, 255, 255, 0.62);
        --panel: #17110b;
        --keyline: rgba(251, 146, 60, 0.6);
        --font: 'Inter', 'Helvetica Neue', Arial, system-ui, sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 1080px; overflow: hidden; font-family: var(--font); color: var(--text); background: var(--bg); }
      #root { position: relative; width: 100%; height: 1080px; }
      #bg { position: absolute; inset: 0; background:
        radial-gradient(circle at 16% 18%, rgba(251,146,60,0.13) 0%, transparent 50%),
        var(--bg); }

      /* Everything lives inside the left 1200px — the side host owns the rest. */
      #zone { position: absolute; left: 0; top: 0; width: 1200px; height: 1080px; }

      #marks { position: absolute; left: 100px; right: 100px; top: 130px;
        display: flex; justify-content: center; align-items: flex-start; gap: 130px; }
      .mark { display: flex; flex-direction: column; align-items: center; will-change: transform, opacity; opacity: 0; }
      .tile { width: 190px; height: 190px; border-radius: 26px; background: rgba(255,255,255,0.045);
        border: 2px solid var(--keyline); display: flex; align-items: center; justify-content: center;
        box-shadow: 0 14px 36px rgba(0,0,0,0.42); }
      .tile img { width: 58%; height: 58%; object-fit: contain; }
      .tile .fallback { font-size: 64px; font-weight: 800; color: var(--dim); }
      .mark .name { margin-top: 22px; font-size: 38px; font-weight: 700; letter-spacing: -0.01em; }

      #seam { position: absolute; left: 50%; top: 150px; width: 2px; height: 210px;
        background: linear-gradient(180deg, transparent, var(--accent) 25%, var(--accent) 75%, transparent);
        transform: translateX(-50%); opacity: 0; }

      #rows { position: absolute; left: 100px; top: 470px; width: 1000px;
        display: flex; flex-direction: column; gap: 34px; }
      .row { height: 116px; border-radius: 18px; background: var(--panel);
        border: 2px solid var(--keyline); display: flex; align-items: center; justify-content: center;
        font-size: 46px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase;
        color: var(--accent); box-shadow: 0 10px 26px rgba(0,0,0,0.4);
        opacity: 0; will-change: transform, opacity; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="tape-board-side"
      data-start="0"
      data-duration="15"
      data-width="1920"
      data-height="1080"
      data-composition-variables='{"platforms":[{"name":"Submagic","logo":"submagic"},{"name":"OpusClip","logo":"opusclip"}],"pains":[{"label":"Captions"},{"label":"Pacing"},{"label":"Layouts"}],"beats":[{"label":"Captions","at":5.8},{"label":"Pacing","at":7.7},{"label":"Layouts","at":8.8}]}'
    >
      <div id="bg" class="clip" data-start="0" data-duration="15" data-track-index="0"></div>
      <div id="frame" class="clip" data-start="0" data-duration="15" data-track-index="1">
        <div id="zone">
          <div id="marks"></div>
          <div id="seam"></div>
          <div id="rows"></div>
        </div>
      </div>
    </div>

    <script>
      /* ===== CONTENT ===== (editor edits ONLY this) */
      const VARS =
        (window.__hyperframes && window.__hyperframes.getVariables
          ? window.__hyperframes.getVariables()
          : null) || {};
      const DATA = {
        platforms: VARS.platforms ?? [
          { name: 'Submagic', logo: 'submagic' },
          { name: 'OpusClip', logo: 'opusclip' },
        ],
        pains: VARS.pains ?? [{ label: 'Captions' }, { label: 'Pacing' }, { label: 'Layouts' }],
        // Word-anchored beats [{label, at}] — each pain row slides in as it is
        // spoken. Without beats the rows cascade on a default cadence.
        beats: Array.isArray(VARS.beats) ? VARS.beats : null,
      };

      /* ===== TIMELINE (LOCKED — do not edit) ===== */
      const $ = (id) => document.getElementById(id);
      const LOGOS = VARS.__logos ?? {};

      // Renderer quirk (verified 2026-07-31): color: var(--accent) on text
      // renders WHITE in every --variables render. The CSS rule stays for the
      // browser/board; the render gets the token resolved to an inline literal.
      const ACCENT = (getComputedStyle(document.documentElement).getPropertyValue('--accent') || '').trim() || '#fb923c';

      function build() {
        $('marks').innerHTML = DATA.platforms.slice(0, 2).map((p) => {
          const src = LOGOS[p.logo];
          const logo = src
            ? `<img src="${src}" alt="">`
            : `<span class="fallback">${(p.name || '?')[0]}</span>`;
          return `<div class="mark"><div class="tile">${logo}</div><div class="name">${p.name || ''}</div></div>`;
        }).join('');
        $('rows').innerHTML = DATA.pains.slice(0, 3).map((p) =>
          `<div class="row" data-pain="${p.label}" style="color:${ACCENT}">${p.label}</div>`).join('');
      }
      build();

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const marks = gsap.utils.toArray('.mark');
      const rows = gsap.utils.toArray('.row');
      const beats = DATA.beats ?? [];
      const rowAt = (label, fallback) => beats.find((b) => b.label === label)?.at ?? fallback;

      // The board sets: marks land, the seam draws between them.
      tl.fromTo(marks[0], { opacity: 0, x: -46 }, { opacity: 1, x: 0, duration: 0.65, ease: 'power4.out' }, 0.3);
      tl.fromTo(marks[1], { opacity: 0, x: 46 }, { opacity: 1, x: 0, duration: 0.65, ease: 'power4.out' }, 0.42);
      tl.fromTo('#seam', { opacity: 0, scaleY: 0.2 }, { opacity: 1, scaleY: 1, duration: 0.5, ease: 'power3.inOut' }, 0.75);

      // Pain rows slide in word-synced.
      DATA.pains.slice(0, 3).forEach((p, i) => {
        const at = rowAt(p.label, 4.5 + i * 1.5);
        tl.fromTo(rows[i], { opacity: 0, x: -70 }, { opacity: 1, x: 0, duration: 0.55, ease: 'power4.out' }, at);
      });

      // Life through the hold — the seam breathes and the marks float gently.
      // Bounded repeats: an infinite tween breaks the frame-seeking renderer.
      tl.to(marks, { y: -6, duration: 1.6, ease: 'sine.inOut', yoyo: true, repeat: 10, stagger: 0.2 }, 1.6);
      tl.to('#seam', { opacity: 0.55, duration: 1.3, ease: 'sine.inOut', yoyo: true, repeat: 10 }, 1.6);

      window.__timelines['tape-board-side'] = tl;
    </script>
  </body>
</html>
