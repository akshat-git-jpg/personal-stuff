<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animate storyboard</title>
<style>
  :root { --bg: #111; --panel: #1b1b1b; --line: #2c2c2c; --text: #eee; --dim: #999; --accent: #fb923c; --ok: #34d399; --no: #ef4444; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, sans-serif; }
  main { max-width: 1400px; margin: 0 auto; padding: 16px; }
  header { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; margin-bottom: 12px; }
  h1 { font-size: 18px; margin: 0; }
  .dim { color: var(--dim); font-size: 13px; }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
  .card img { width: 100%; aspect-ratio: 16 / 9; object-fit: contain; background: #000; display: block; }
  .body { padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .meta { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--dim); }
  .status { font-weight: 600; text-transform: uppercase; font-size: 12px; }
  .status.approved { color: var(--ok); } .status.rejected { color: var(--no); } .status.pending, .status.stale, .status.missing { color: var(--accent); }
  textarea { width: 100%; min-height: 56px; font: inherit; color: var(--text); background: #151515; border: 1px solid var(--line); border-radius: 6px; padding: 6px; resize: vertical; }
  .row { display: flex; gap: 8px; }
  button { flex: 1; font: inherit; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line); background: #222; color: var(--text); cursor: pointer; }
  button.ok { border-color: var(--ok); } button.no { border-color: var(--no); }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="title">Storyboard</h1>
    <span class="dim">Each still is drawn over the real recording frame at its key time. Approve it, or reject it and say what to change.</span>
    <a href="/sheet.png" target="_blank">contact sheet</a>
  </header>
  <div class="grid" id="grid"></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
async function load() {
  const s = await (await fetch('/api/state')).json();
  $('title').textContent = `Storyboard: ${s.video}`;
  $('grid').innerHTML = s.panels.map((p) => `
    <div class="card" data-id="${p.id}">
      ${p.status === 'missing' ? '<div class="dim" style="padding:40px;text-align:center">not drawn yet</div>' : `<img src="/panel/${p.id}.png?${Date.now()}" alt="${esc(p.id)}">`}
      <div class="body">
        <div class="meta"><span>${p.n} · ${p.id} · ${p.kind} · ${p.at != null ? (p.start + p.at).toFixed(1) + 's' : ''}</span><span class="status ${p.status}">${p.status}</span></div>
        <div>${esc(p.caption ?? p.idea)}</div>
        <textarea placeholder="what to change (required to reject)">${esc(p.note)}</textarea>
        <div class="row"><button class="ok">Approve</button><button class="no">Reject</button></div>
      </div>
    </div>`).join('');
}
$('grid').addEventListener('click', async (e) => {
  const b = e.target.closest('button'); if (!b) return;
  const card = b.closest('.card');
  const r = await (await fetch('/api/decide', { method: 'POST', body: JSON.stringify({ id: card.dataset.id, status: b.classList.contains('ok') ? 'approved' : 'rejected', note: card.querySelector('textarea').value }) })).json();
  if (!r.ok) alert(r.error);
  load();
});
load();
</script>
</body>
</html>
