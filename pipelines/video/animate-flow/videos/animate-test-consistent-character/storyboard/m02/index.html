<!doctype html><html><head><meta charset="utf-8"><style>
:root{--bg-from:#3a1f08;--bg-to:#0a0805;--text:#fff;--text-dim:rgba(255,239,219,0.6);--accent:#fb923c;--positive:#34d399;--negative:#ef4444}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#000}
body{position:relative;font-family:"Inter",system-ui,sans-serif;color:var(--text);background:radial-gradient(circle at 30% 18%,var(--bg-from) 0%,var(--bg-to) 72%)}
.a{position:absolute}
.hero{font-weight:900;letter-spacing:-0.035em;line-height:1;white-space:nowrap}
.sec{font-weight:600;letter-spacing:-0.015em;line-height:1.2;white-space:nowrap;font-size:48px}
.dim{color:var(--text-dim)}.acc{color:var(--accent)}
.panel{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:24px}
.logo{position:absolute;border-radius:28px;overflow:hidden}
.logo img{width:100%;height:100%;display:block}
.logo.d::after{content:"";position:absolute;inset:0;border-radius:28px;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.10)}
</style></head><body>
<div class="logo d" style="left:120px;top:110px;width:200px;height:200px"><img src="assets/openart.png"></div>
<div class="a hero" style="left:370px;top:105px;font-size:210px">OpenArt</div>
<svg class="a" style="left:1240px;top:130px" width="150" height="150" viewBox="0 0 150 150"><circle cx="75" cy="75" r="70" fill="#34d399"/><path d="M42 78 L66 102 L110 52" fill="none" stroke="#0a0805" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/></svg>
<svg class="a" style="left:0;top:0" width="1920" height="1080">
<line x1="120" y1="640" x2="1800" y2="640" stroke="#fb923c" stroke-width="14" stroke-linecap="round"/>
<g transform="translate(360 560)"><circle cx="0" cy="-95" r="42" fill="#ffefdb"/><rect x="-55" y="-45" width="110" height="170" rx="40" fill="#ffefdb"/></g><g transform="translate(960 560)"><circle cx="0" cy="-95" r="42" fill="#ffefdb"/><rect x="-55" y="-45" width="110" height="170" rx="40" fill="#ffefdb"/></g><g transform="translate(1560 560)"><circle cx="0" cy="-95" r="42" fill="#ffefdb"/><rect x="-55" y="-45" width="110" height="170" rx="40" fill="#ffefdb"/></g>
</svg>
<div class="a sec" style="left:120px;top:830px;font-size:64px">One workflow. <span class="acc">Same character</span>, every scene.</div>
</body></html>
