<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>m05 — Pricing: worth paying for?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --bg-from: #3a1f08;
        --bg-to: #0a0805;
        --text: #ffffff;
        --text-dim: rgba(255, 239, 219, 0.6);
        --accent: #fb923c;
        --positive: #34d399;
        --negative: #ef4444;
        --gold: #facc15;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: #000;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        font-family: "Inter", system-ui, sans-serif;
        color: var(--text);
      }
      #bg {
        position: absolute;
        inset: 0;
        background: var(--bg-to);
        overflow: hidden;
      }
      #glow {
        position: absolute;
        left: -480px;
        top: -560px;
        width: 2400px;
        height: 1800px;
        background: radial-gradient(
          ellipse at 38% 42%,
          var(--bg-from) 0%,
          rgba(58, 31, 8, 0.55) 30%,
          rgba(10, 8, 5, 0) 62%
        );
      }
      #scene {
        position: absolute;
        inset: 0;
        box-sizing: border-box;
        padding: 120px 160px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      #copy {
        width: 900px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
      }
      #rule {
        display: block;
        width: 520px;
        height: 8px;
        border-radius: 4px;
        background: var(--accent);
        transform-origin: 0 50%;
        margin: 0 0 6px 8px;
      }
      #hero-row {
        display: flex;
        align-items: center;
        gap: 20px;
      }
      #tag {
        display: block;
        width: 220px;
        height: 264px;
        overflow: visible;
        margin-top: -36px;
        margin-left: -30px;
      }
      #hero {
        margin: 0;
        font-size: 176px;
        font-weight: 900;
        letter-spacing: -0.035em;
        line-height: 1;
      }
      #question {
        margin: 48px 0 0 8px;
        font-size: 56px;
        font-weight: 700;
        letter-spacing: -0.015em;
        line-height: 1.2;
        color: var(--text);
        display: flex;
        gap: 0.26em;
      }
      #question .w {
        display: inline-block;
      }
      #question .q {
        display: inline-block;
        color: var(--accent);
        margin-left: -0.22em;
        font-weight: 900;
        transform-origin: 50% 80%;
      }
      #scale {
        display: block;
        width: 660px;
        height: 616px;
        overflow: visible;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="moment"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="4.78"
      data-fps="30"
    >
      <div id="bg" class="clip" data-start="0" data-duration="4.78" data-track-index="0">
        <div id="glow" data-layout-allow-overflow></div>
      </div>

      <section id="scene" class="clip" data-start="0" data-duration="4.78" data-track-index="1">
        <div id="copy">
          <div id="rule"></div>
          <div id="hero-row">
            <svg id="tag" viewBox="0 0 200 240" aria-hidden="true">
              <g id="tag-swing">
                <line x1="100" y1="8" x2="100" y2="72" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
                <circle cx="100" cy="8" r="7" fill="#ffffff" />
                <path
                  d="M100 56 L156 104 L156 222 Q156 234 144 234 L56 234 Q44 234 44 222 L44 104 Z"
                  fill="rgba(251,146,60,0.14)"
                  stroke="#fb923c"
                  stroke-width="4"
                  stroke-linejoin="round"
                />
                <circle cx="100" cy="94" r="11" fill="none" stroke="#fb923c" stroke-width="4" />
                <text
                  x="100"
                  y="196"
                  text-anchor="middle"
                  font-family="Inter, system-ui, sans-serif"
                  font-weight="900"
                  font-size="76"
                  fill="#ffffff"
                >$</text>
              </g>
            </svg>
            <h1 id="hero">Pricing</h1>
          </div>
          <div id="question">
            <span class="w" id="w1">Worth</span>
            <span class="w" id="w2">paying</span>
            <span class="w" id="w3">for</span>
            <span class="q" id="qmark">?</span>
          </div>
        </div>

        <svg id="scale" viewBox="0 0 600 560" aria-hidden="true">
          <!-- base + post -->
          <g id="stand">
            <path d="M210 500 L390 500" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
            <path d="M250 500 L300 452 L350 500" fill="rgba(255,255,255,0.06)" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" />
            <line id="post" x1="300" y1="460" x2="300" y2="130" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
          </g>
          <!-- beam pivots at (300,130), arms 220 -->
          <g id="beam">
            <line x1="80" y1="130" x2="520" y2="130" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
            <circle cx="80" cy="130" r="7" fill="#ffffff" />
            <circle cx="520" cy="130" r="7" fill="#ffffff" />
          </g>
          <circle id="pivot" cx="300" cy="130" r="14" fill="#fb923c" />

          <!-- left pan: cost -->
          <g id="panL-pos" transform="translate(80 130)">
            <g id="panL">
              <path d="M0 0 L-78 160 M0 0 L78 160" stroke="rgba(255,239,219,0.6)" stroke-width="3" />
              <path d="M-96 160 Q0 214 96 160 Z" fill="rgba(255,255,255,0.06)" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" />
              <g id="coin">
                <circle cx="0" cy="122" r="36" fill="rgba(251,146,60,0.18)" stroke="#fb923c" stroke-width="5" />
                <text x="0" y="139" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="900" font-size="48" fill="#fb923c">$</text>
              </g>
            </g>
          </g>

          <!-- right pan: value -->
          <g id="panR-pos" transform="translate(520 130)">
            <g id="panR">
              <path d="M0 0 L-78 160 M0 0 L78 160" stroke="rgba(255,239,219,0.6)" stroke-width="3" />
              <path d="M-96 160 Q0 214 96 160 Z" fill="rgba(255,255,255,0.06)" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" />
              <g id="star">
                <path
                  d="M0 82 L11 108 L39 110 L18 128 L25 156 L0 141 L-25 156 L-18 128 L-39 110 L-11 108 Z"
                  fill="rgba(255,255,255,0.12)"
                  stroke="#ffffff"
                  stroke-width="5"
                  stroke-linejoin="round"
                />
              </g>
            </g>
          </g>
        </svg>
      </section>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const D = 4.78;

      // Ground: glow drifts the whole moment so the frame is never static.
      tl.fromTo("#glow", { x: -40, y: -20, scale: 1 }, { x: 70, y: 40, scale: 1.08, duration: D, ease: "sine.inOut" }, 0);

      // "finally" (0.28): the accent rule ticks in; "breakdown" (1.02): it runs full width.
      tl.fromTo("#rule", { scaleX: 0, opacity: 0 }, { scaleX: 0.18, opacity: 1, duration: 0.45, ease: "power3.out" }, 0.28);
      tl.to("#rule", { scaleX: 1, duration: 0.6, ease: "power3.out" }, 1.02);

      // "pricing" (1.54): hero rises, the price tag swings in from its pin and settles.
      tl.from("#hero", { y: 24, opacity: 0, duration: 0.55, ease: "power3.out" }, 1.54);
      tl.from("#tag", { opacity: 0, duration: 0.25, ease: "power2.out" }, 1.54);
      tl.fromTo("#tag-swing", { rotation: -62, svgOrigin: "100 8" }, { rotation: 14, duration: 0.42, ease: "power2.out" }, 1.54);
      tl.to("#tag-swing", { rotation: -6, duration: 0.34, ease: "sine.inOut" }, 1.96);
      tl.to("#tag-swing", { rotation: 4, duration: 0.5, ease: "sine.inOut" }, 2.3);
      tl.to("#tag-swing", { rotation: -3, duration: 0.7, ease: "sine.inOut" }, 2.8);
      tl.to("#tag-swing", { rotation: 2, duration: 0.8, ease: "sine.inOut" }, 3.5);
      tl.to("#tag-swing", { rotation: -1, duration: 0.48, ease: "sine.inOut" }, 4.3);

      // "whether" (2.16): the balance assembles, empty and level.
      tl.from("#stand", { opacity: 0, y: 20, duration: 0.45, ease: "power3.out" }, 2.16);
      tl.from("#post", { scaleY: 0, svgOrigin: "300 460", duration: 0.45, ease: "power3.out" }, 2.2);
      tl.from("#beam", { scaleX: 0, svgOrigin: "300 130", opacity: 0, duration: 0.5, ease: "power3.out" }, 2.3);
      tl.from("#pivot", { scale: 0.6, svgOrigin: "300 130", opacity: 0, duration: 0.4, ease: "back.out(1.6)" }, 2.36);
      tl.from(["#panL", "#panR"], { opacity: 0, y: -24, duration: 0.45, ease: "power2.out", stagger: 0.06 }, 2.42);
      tl.set(["#coin", "#star"], { opacity: 0 }, 0);

      // Tip the beam by `deg` (positive = right pan down). Pans hang from the beam ends,
      // so they move vertically by arm * sin(deg) with the same ease and timing.
      const ARM = 220;
      function tip(deg, at, dur, ease) {
        const dy = ARM * Math.sin((deg * Math.PI) / 180);
        tl.to("#beam", { rotation: deg, svgOrigin: "300 130", duration: dur, ease }, at);
        tl.to("#panL", { y: -dy, duration: dur, ease }, at);
        tl.to("#panR", { y: dy, duration: dur, ease }, at);
      }

      // Question words land on the voice. "worth" drops value in the right pan,
      // "paying" drops cost in the left: the scale weighs one against the other.
      tl.from("#w1", { opacity: 0, y: 20, duration: 0.45, ease: "power2.out" }, 2.74);
      tl.fromTo("#star", { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.in" }, 2.74);
      tip(9, 2.96, 0.36, "power2.out");

      tl.from("#w2", { opacity: 0, y: 20, duration: 0.45, ease: "power2.out" }, 3.06);
      tl.fromTo("#coin", { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.in" }, 3.06);
      tip(-10, 3.34, 0.36, "power2.out");

      tl.from("#w3", { opacity: 0, y: 20, duration: 0.45, ease: "power2.out" }, 3.34);
      tl.from("#qmark", { opacity: 0, scale: 0.9, y: 10, duration: 0.45, ease: "back.out(1.6)" }, 3.66);

      // Undecided: it keeps rocking, "paying" (4.12) pulls cost down again, then it hangs near level.
      tip(7, 3.7, 0.42, "sine.inOut");
      tip(-6, 4.12, 0.3, "sine.inOut");
      tip(2, 4.42, 0.36, "sine.inOut");

      // The accent question mark pulses on the final "for".
      tl.to("#qmark", { scale: 1.12, duration: 0.18, ease: "power2.out" }, 4.4);
      tl.to("#qmark", { scale: 1, duration: 0.2, ease: "power2.inOut" }, 4.58);

      window.__timelines["moment"] = tl;
    </script>
  </body>
</html>
