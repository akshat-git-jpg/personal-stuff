name = "kushal-income"
main = "src/worker/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

# SPA built into dist/, served by the Worker via the ASSETS binding.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# D1 holds the ledger the on-demand sync pushes in (already masked) plus the
# owner's tags. This Worker never holds a bank credential and never calls a bank.
[[d1_databases]]
binding = "DB"
database_name = "kushal-money"
database_id = "REPLACE_AT_DEPLOY"
migrations_dir = "migrations"

[[routes]]
pattern = "kushal-income.agrolloo.com"
custom_domain = true

# Secrets (set with `npx wrangler secret put <NAME>`, mirror in .dev.vars locally):
#   APP_PASSWORD    - the shared password for the gate
#   SESSION_SECRET  - random string used to sign the auth cookie
#   INGEST_TOKEN    - bearer token the sync uses for POST /api/ingest
